backend:
  name: github
  repo: jalgaonzone/jalgaonzone.github.io
  branch: main

media_folder: "Images/uploads"
public_folder: "/Images/uploads"

site_url: "https://endearing-toffee-e5a6d2.netlify.app"
display_url: "https://endearing-toffee-e5a6d2.netlify.app"

publish_mode: simple

collections:

  # 📰 JALGAON NEWS
    - name: "news"
    label: "Jalgaon News"
    folder: "articles"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "News Title", name: "title", widget: "string", required: true }

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Jalgaon"
          - "Politics"
          - "Education"
          - "Sports"
          - "Business"
          - "Entertainment"
          - "Local News"
        default: "Jalgaon"
        required: true

      - { label: "Featured Image", name: "image", widget: "image", required: false }

      - { label: "Short Description", name: "description", widget: "text", required: true }

      - { label: "Article Content", name: "body", widget: "markdown", required: true }

      - { label: "Publish Date", name: "date", widget: "datetime", required: true }


  # 📜 HISTORY
  - name: "history"
    label: "📜 Jalgaon History"
    folder: "history"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"

    fields:
      - label: "📜 Title"
        name: "title"
        widget: "string"

      - label: "🖼️ Featured Image"
        name: "image"
        widget: "image"

      - label: "📝 Description"
        name: "description"
        widget: "text"

      - label: "📅 Date"
        name: "date"
        widget: "datetime"

      - label: "📄 History Content"
        name: "body"
        widget: "markdown"


  # 📍 PLACES
  - name: "places"
    label: "📍 Jalgaon Places"
    folder: "places"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"

    fields:
      - label: "📍 Place Name"
        name: "title"
        widget: "string"

      - label: "🖼️ Featured Image"
        name: "image"
        widget: "image"

      - label: "📍 Location"
        name: "location"
        widget: "string"

      - label: "📝 Short Description"
        name: "description"
        widget: "text"

      - label: "📄 Place Information"
        name: "body"
        widget: "markdown"


  # ✍️ BLOGS
  - name: "blogs"
    label: "✍️ Jalgaon Blogs"
    folder: "blogs"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"

    fields:
      - label: "✍️ Blog Title"
        name: "title"
        widget: "string"

      - label: "🖼️ Featured Image"
        name: "image"
        widget: "image"

      - label: "👤 Author"
        name: "author"
        widget: "string"
        default: "Jalgaon Zone"

      - label: "📅 Publish Date"
        name: "date"
        widget: "datetime"

      - label: "📝 Short Description"
        name: "description"
        widget: "text"

      - label: "📄 Blog Content"
        name: "body"
        widget: "markdown"


  # 🛍️ DEALS
  - name: "deals"
    label: "🛍️ Jalgaon Deals"
    folder: "deals"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"

    fields:
      - label: "🛍️ Deal/Product Name"
        name: "title"
        widget: "string"

      - label: "🖼️ Product Image"
        name: "image"
        widget: "image"

      - label: "💰 Price"
        name: "price"
        widget: "string"

      - label: "🏷️ Category"
        name: "category"
        widget: "string"

      - label: "📝 Description"
        name: "description"
        widget: "text"

      - label: "🔗 Product Link"
        name: "link"
        widget: "string"

      - label: "📄 Deal Details"
        name: "body"
        widget: "markdown"
