backend:
  name: github
  repo: jalgaonzone/jalgaonzone.github.io
  branch: main

media_folder: "Images/uploads"
public_folder: "/Images/uploads"

publish_mode: simple

collections:

  - name: "news"
    label: "Jalgaon News"
    folder: "articles"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "News Title"
        name: "title"
        widget: "string"
        required: true

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Jalgaon"
          - "Politics"
          - "Education"
          - "Sports"
          - "Business"
          - "Entertainment"
          - "Local News"
        default: "Jalgaon"
        required: true

      - label: "Featured Image"
        name: "image"
        widget: "image"
        required: false

      - label: "Short Description"
        name: "description"
        widget: "text"
        required: true

      - label: "Article Content"
        name: "body"
        widget: "markdown"
        required: true

      - label: "Publish Date"
        name: "date"
        widget: "datetime"
        required: true

  - name: "history"
    label: "History"
    folder: "history"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Content", name: "body", widget: "markdown" }

  - name: "places"
    label: "Places"
    folder: "places"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Place Name", name: "title", widget: "string" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Description", name: "body", widget: "markdown" }

  - name: "blogs"
    label: "Blogs"
    folder: "blogs"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Blog Title", name: "title", widget: "string" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Content", name: "body", widget: "markdown" }

  - name: "deals"
    label: "Deals"
    folder: "deals"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Deal Title", name: "title", widget: "string" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Deal Link", name: "link", widget: "string", required: false }
