              ("#15803d", "#14532d")
          ]


          # =========================================================
          # READ EXISTING ARTICLES
          # =========================================================

          existing_text = ""

          for root, dirs, files in os.walk(
              ARTICLES_DIR
          ):

              for filename in files:

                  if not filename.endswith(".md"):
                      continue

                  path = os.path.join(
                      root,
                      filename
                  )

                  try:

                      with open(
                          path,
                          "r",
                          encoding="utf-8"
                      ) as f:

                          existing_text += (
                              f.read().lower()
                              + "\n"
                          )

                  except Exception as error:

                      print(
                          "Read error:",
                          path,
                          error
                      )


          # =========================================================
          # NORMALIZE
          # =========================================================

          def normalize(text):

              text = text.lower()

              text = re.sub(
                  r"[^a-z0-9\u0900-\u097f]+",
                  " ",
                  text
              )

              return " ".join(
                  text.split()
              )


          normalized_existing = normalize(
              existing_text
          )


          # =========================================================
          # DUPLICATE CHECK
          # =========================================================

          def already_used(title):

              return (
                  normalize(title)
                  in normalized_existing
              )


