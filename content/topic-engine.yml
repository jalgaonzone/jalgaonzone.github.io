          ## निष्कर्ष

          {title} हा माहिती शोधणाऱ्या वाचकांसाठी उपयुक्त विषय आहे. या लेखामध्ये मूलभूत माहिती, स्थानिक संदर्भ, उपयोगी मुद्दे आणि माहिती पडताळण्याची पद्धत समजावून सांगण्याचा प्रयत्न करण्यात आला आहे.

          प्रत्यक्ष निर्णय घेताना स्थानिक परिस्थिती आणि नवीन अधिकृत माहिती लक्षात घेणे आवश्यक आहे. बदलणाऱ्या विषयांसाठी जुन्या माहितीवर अवलंबून न राहता संबंधित विभागाची नवीन सूचना तपासावी.

          Jalgaon Zone वर स्थानिक आणि उपयोगी माहिती नियमितपणे प्रकाशित करण्याचा प्रयत्न केला जात आहे.
          """


          # =========================================================
          # ARTICLE CREATOR
          # =========================================================

          def create_article(
              title,
              angle,
              region,
              language="Marathi"
          ):

              intro = intros[
                  day_number % len(intros)
              ]

              body = f"""# {title}

          **दिनांक:** {date_text}

          {intro}

          ## {title} म्हणजे काय?

          {title} हा {region} संदर्भातील महत्त्वाचा विषय आहे. {angle}. या विषयाचा अभ्यास करताना उपलब्ध माहितीचा स्रोत, तारीख आणि स्थानिक परिस्थिती लक्षात घेणे आवश्यक आहे.

          """

              body += generate_sections(
                  title,
                  angle,
                  region
              )

              body += faq(
                  title,
                  region
              )

              body += internal_links()

              body += conclusion(
                  title
              )

              # Guarantee minimum length without repeating exact same block.
              while len(body.split()) < MIN_WORDS:

                  body += f"""

          ## अतिरिक्त माहिती

          {title} या विषयाबाबत अधिक माहिती समजून घेताना प्रत्यक्ष परिस्थितीचा विचार करणे महत्त्वाचे आहे. प्रत्येक व्यक्ती, संस्था किंवा परिसरासाठी उपलब्ध पर्याय वेगळे असू शकतात.

          योग्य नियोजन करताना उपलब्ध संसाधने, वेळ, खर्च आणि आवश्यक कौशल्ये यांचा विचार करावा. माहितीचा स्रोत विश्वासार्ह आहे का हे तपासल्यास चुकीची माहिती वापरण्याची शक्यता कमी करता येते.

          संबंधित विषय बदलत असल्यास नवीन अधिकृत सूचना तपासणे आवश्यक आहे. स्थानिक पातळीवरील माहिती उपलब्ध असल्यास तिचीही पडताळणी करावी.

          """

              return body


          # =========================================================
          # SELECT REGION MIX
          # =========================================================

          location_mix = config.get(
              "traffic_strategy",
              {}
          ).get(
              "location_mix",
              {}
          )

          # Daily 5 article target.
          # 20/30/25/25 is converted into a rotating 5-day pattern.

          patterns = [

              [
                  "Global",
                  "India",
                  "India",
                  "Maharashtra",
                  "Jalgaon"
              ],

              [
                  "Global",
                  "India",
                  "Maharashtra",
                  "Maharashtra",
                  "Jalgaon"
              ],

              [
                  "Global",
                  "India",
                  "India",
                  "Maharashtra",
                  "Jalgaon"
              ],

              [
                  "Global",
                  "India",
                  "Maharashtra",
                  "Jalgaon",
                  "Jalgaon"
              ],

              [
                  "Global",
                  "India",
                  "Maharashtra",
                  "Maharashtra",
                  "Jalgaon"
              ]
          ]

          selected_regions = patterns[
              day_number % len(patterns)
          ]


          print("")
          print(
              "Selected regions:",
              selected_regions
          )


          # =========================================================
          # SELECT UNIQUE TOPICS
          # =========================================================

          selected = []

          region_positions = {}

          for region in selected_regions:

              region_positions.setdefault(
                  region,
                  0
              )

              available = topics.get(
                  region,
                  []
              )

              start = (
                  day_number
                  + region_positions[region]
              ) % len(available)

              found = None

              for offset in range(
                  len(available)
              ):

                  index = (
                      start
                      + offset
                  ) % len(available)

                  title, angle = available[
                      index
                  ]

                  if not already_used(
                      title
                  ):

                      found = (
                          title,
                          angle
                      )

                      region_positions[
                          region
                      ] += 1

                      break

              if found:

                  selected.append(
                      (
                          region,
                          found[0],
                          found[1]
                      )
                  )


          # =========================================================
          # CREATE ARTICLES
          # =========================================================

          new_articles = []

          for i, item in enumerate(
              selected
          ):

              region = item[0]
              title = item[1]
              angle = item[2]

              slug = make_slug(
                  title
              )

              filename_base = (
                  f"{slug}-{date_file}"
              )

              article_file = (
                  f"{ARTICLES_DIR}/"
                  f"{filename_base}.md"
              )

              image_file = (
                  f"{IMAGES_DIR}/"
                  f"{filename_base}.svg"
              )

              if os.path.exists(
                  article_file
              ):

                  print(
                      "Already exists:",
                      article_file
                  )

                  continue


              # =====================================================
              # ARTICLE
              # =====================================================

              body = create_article(
                  title,
                  angle,
                  region
              )

              word_count = len(
                  body.split()
              )

              print("")
              print(
                  "===================================="
              )
              print(
                  f"{region}: {title}"
              )
              print(
                  f"Word count: {word_count}"
              )

              if word_count < MIN_WORDS:

                  raise Exception(
                      f"Article below {MIN_WORDS} words: "
                      + article_file
                  )


              # =====================================================
              # IMAGE
              # =====================================================

              color1, color2 = colors[
                  i % len(colors)
              ]

              title_lines = []

              words = title.split()
              current = ""

              for word in words:

                  test = (
                      current
                      + " "
                      + word
                  ).strip()

                  if len(test) <= 30:

                      current = test

                  else:

                      if current:
                          title_lines.append(
                              current
                          )

                      current = word

              if current:
                  title_lines.append(
                      current
                  )

              title_lines = title_lines[:3]

              title_svg = ""

              y = 280

              for line in title_lines:

                  title_svg += f"""
          <text
              x="70"
              y="{y}"
              font-size="46"
              font-weight="700"
              fill="white"
              font-family="Noto Sans Devanagari, Arial, sans-serif">
              {html.escape(line)}
          </text>
          """

                  y += 65


              svg = f"""<?xml version="1.0" encoding="UTF-8"?>

          <svg
              xmlns="http://www.w3.org/2000/svg"
              width="1200"
              height="630"
              viewBox="0 0 1200 630">

              <defs>

                  <linearGradient
                      id="bg"
                      x1="0%"
                      y1="0%"
                      x2="100%"
                      y2="100%">

                      <stop
                          offset="0%"
                          stop-color="{color1}"/>

                      <stop
                          offset="100%"
                          stop-color="{color2}"/>

                  </linearGradient>

              </defs>

              <rect
                  width="1200"
                  height="630"
                  fill="url(#bg)"/>

              <circle
                  cx="1050"
                  cy="90"
                  r="180"
                  fill="white"
                  opacity="0.08"/>

              <circle
                  cx="1100"
                  cy="560"
                  r="230"
                  fill="white"
                  opacity="0.06"/>

              <text
                  x="70"
                  y="85"
                  font-size="30"
                  font-weight="600"
                  fill="white"
                  font-family="Arial, sans-serif">
                  JALGAON ZONE
              </text>

              <rect
                  x="70"
                  y="125"
                  width="300"
                  height="52"
                  rx="26"
                  fill="white"
                  opacity="0.18"/>

              <text
                  x="95"
                  y="160"
                  font-size="24"
                  fill="white"
                  font-family="Arial, sans-serif">
                  {html.escape(region)}
              </text>

              {title_svg}

              <text
                  x="70"
                  y="560"
                  font-size="24"
                  fill="white"
                  opacity="0.9"
                  font-family="Arial, sans-serif">
                  {date_text}
              </text>

              <text
                  x="1130"
                  y="570"
                  text-anchor="end"
                  font-size="22"
                  fill="white"
                  opacity="0.8"
                  font-family="Arial, sans-serif">
                  Jalgaon • Maharashtra
              </text>

          </svg>
          """

              with open(
                  image_file,
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(svg)


              with open(
                  article_file,
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(body)


              article_id = filename_base

              metadata = {

                  "id": article_id,

                  "title": title,

                  "category": region,

                  "date": date_text,

                  "image": image_file,

                  "description":
                      (
                          title
                          + " — Jalgaon Zone वरील "
                          + "सविस्तर माहिती."
                      ),

                  "file": article_file,

                  "link":
                      "article.html?id="
                      + article_id
              }

              new_articles.append(
                  metadata
              )

              print(
                  "Created:",
                  article_file
              )

              print(
                  "Created:",
                  image_file
              )


          # =========================================================
          # UPDATE ARTICLES-DATA.JS
          # =========================================================

          if new_articles:

              if os.path.exists(
                  DATA_FILE
              ):

                  with open(
                      DATA_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      old_content = f.read()

              else:

                  old_content = (
                      "const articles = [];"
                  )

              start = old_content.find("[")
              end = old_content.rfind("]")

              if (
                  start == -1
                  or end == -1
                  or end <= start
              ):

                  raise Exception(
                      "Invalid articles-data.js"
                  )

              existing_array = (
                  old_content[
                      start + 1:end
                  ].strip()
              )

              entries = []

              for item in new_articles:

                  entries.append(
                      "  "
                      + json.dumps(
                          item,
                          ensure_ascii=False,
                          indent=2
                      )
                  )

              additions = ",\n".join(
                  entries
              )

              if existing_array:

                  combined = (
                      existing_array
                      + ",\n"
                      + additions
                  )

              else:

                  combined = additions

              new_content = (
                  old_content[:start + 1]
                  + "\n"
                  + combined
                  + "\n"
                  + old_content[end:]
              )

              with open(
                  DATA_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(
                      new_content
                  )

              print(
                  "Updated:",
                  DATA_FILE
              )


          # =========================================================
          # UPDATE SITEMAP
          # =========================================================

          existing_urls = set()

          if os.path.exists(
              SITEMAP_FILE
          ):

              with open(
                  SITEMAP_FILE,
                  "r",
                  encoding="utf-8"
              ) as f:

                  sitemap_content = f.read()

              existing_urls = set(
                  re.findall(
                      r"<loc>(.*?)</loc>",
                      sitemap_content
                  )
              )

          else:

              sitemap_content = ""


          for item in new_articles:

              url = (
                  SITE_URL
                  + "/"
                  + item["link"]
              )

              existing_urls.add(
                  url
              )


          static_urls = [

              SITE_URL + "/",

              SITE_URL + "/index.html",

              SITE_URL + "/news.html",

              SITE_URL + "/agriculture.html",

              SITE_URL + "/history.html",

              SITE_URL + "/places.html",

              SITE_URL + "/blogs.html"
          ]


          for url in static_urls:

              existing_urls.add(
                  url
              )


          sorted_urls = sorted(
              existing_urls
          )


          sitemap_lines = [

              '<?xml version="1.0" encoding="UTF-8"?>',

              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          ]


          for url in sorted_urls:

              sitemap_lines.append(
                  f"  <url><loc>{html.escape(url)}</loc></url>"
              )


          sitemap_lines.append(
              "</urlset>"
          )


          with open(
              SITEMAP_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "\n".join(
                      sitemap_lines
                  )
              )


          print(
              "Updated:",
              SITEMAP_FILE
          )


          # =========================================================
          # FINAL REPORT
          # =========================================================

          print("")
          print("====================================")
          print("JALGAON ZONE DAILY AUTOMATION")
          print("====================================")
          print(
              "Date:",
              date_text
          )
          print(
              "Articles created:",
              len(new_articles)
          )
          print(
              "Minimum words:",
              MIN_WORDS
          )
          print(
              "Traffic mix:",
              selected_regions
          )
          print(
              "Duplicate protection: ENABLED"
          )
          print(
              "SEO slugs: ENABLED"
          )
          print(
              "Automatic SVG images: ENABLED"
          )
          print(
              "articles-data.js: UPDATED"
          )
          print(
              "sitemap.xml: UPDATED"
          )
          print("====================================")

          PY


      - name: Show generated files
        run: |

          echo "===================================="
          echo "ARTICLES"
          echo "===================================="

          ls -lah articles/ | tail -30

          echo ""

          echo "===================================="
          echo "IMAGES"
          echo "===================================="

          ls -lah Images/ | tail -30

          echo ""

          echo "===================================="
          echo "SITEMAP"
          echo "===================================="

          ls -lah sitemap.xml


      - name: Check changes
        run: |

          echo "===================================="
          echo "GIT STATUS"
          echo "===================================="

          git status --short


      - name: Commit and Push
        run: |

          git config user.name "Jalgaon Zone Bot"

          git config user.email "actions@github.com"

          git add \
            articles/ \
            Images/ \
            articles-data.js \
            sitemap.xml

          if git diff --cached --quiet; then

              echo "No changes to commit."

              exit 0

          fi

          git commit \
            -m "Daily Jalgaon Zone articles and images"

          git push
