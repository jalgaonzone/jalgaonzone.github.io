              "ऑनलाइन": "online",
              "डिजिटल": "digital",
              "तंत्रज्ञान": "technology"
          }


          def make_slug(text):

              result = text

              for marathi, english in transliteration.items():

                  result = result.replace(
                      marathi,
                      " " + english + " "
                  )

              result = re.sub(
                  r"[^a-zA-Z0-9]+",
                  "-",
                  result
              )

              result = result.strip(
                  "-"
              ).lower()

              short_hash = hashlib.md5(
                  text.encode("utf-8")
              ).hexdigest()[:8]

              return (
                  result[:70]
                  + "-"
                  + short_hash
              )


