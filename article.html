<!DOCTYPE html>
<html lang="mr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jalgaon Zone</title>

<meta name="description"
content="Jalgaon Zone - Jalgaon News, Agriculture, History, Tourism and Local Information">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,"Noto Sans Devanagari",sans-serif;
    background:#f5f5f5;
    color:#222;
    line-height:1.8;
}

header{
    background:#111;
    color:white;
    padding:18px 20px;
}

.nav{
    max-width:1000px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.logo span{
    color:#f4511e;
}

.home{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.home:hover{
    color:#f4511e;
}

.container{
    max-width:900px;
    margin:35px auto;
    padding:0 15px;
}

.article{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 20px rgba(0,0,0,.10);
}

.article img{
    width:100%;
    max-height:500px;
    object-fit:cover;
    display:block;
}

.content{
    padding:30px;
}

.category{
    color:#f4511e;
    font-weight:bold;
    font-size:15px;
}

h1{
    font-size:38px;
    line-height:1.4;
    margin:12px 0;
}

.date{
    color:#777;
    margin-bottom:25px;
    font-size:14px;
}

.content h2{
    margin-top:25px;
    margin-bottom:8px;
    color:#111;
}

.content p{
    margin:12px 0;
}

.content ul{
    margin:15px 0;
    padding-left:25px;
}

.content li{
    margin:6px 0;
}

.content a{
    color:#f4511e;
    font-weight:bold;
}

.back{
    display:inline-block;
    margin-top:30px;
    color:#f4511e;
    font-weight:bold;
    text-decoration:none;
}

.back:hover{
    text-decoration:underline;
}

.error{
    background:white;
    padding:40px;
    text-align:center;
    border-radius:12px;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.error h2{
    margin-top:0;
}

footer{
    margin-top:50px;
    background:#111;
    color:#ccc;
    text-align:center;
    padding:25px;
}

footer strong{
    color:#f4511e;
}

@media(max-width:600px){

    .nav{
        gap:15px;
    }

    .logo{
        font-size:22px;
    }

    .home{
        font-size:14px;
    }

    .container{
        margin:20px auto;
        padding:0 10px;
    }

    h1{
        font-size:27px;
    }

    .content h2{
        font-size:21px;
    }

    .content{
        padding:20px;
    }

    .article img{
        max-height:350px;
    }

}

</style>

</head>


<body>

<header>

    <div class="nav">

        <div class="logo">
            Jalgaon <span>Zone</span>
        </div>

        <a href="index.html" class="home">
            ← Home
        </a>

    </div>

</header>


<div class="container">

    <div id="article">

        <div class="error">
            Article loading...
        </div>

    </div>

</div>


<footer>

    © 2026 <strong>Jalgaon Zone</strong>

    <br>

    Jalgaon • Maharashtra • India

</footer>


<script>

/* =====================================================
   GET ARTICLE ID
===================================================== */

const params =
    new URLSearchParams(window.location.search);

const id =
    params.get("id");


/* =====================================================
   ARTICLE FILE MAP
===================================================== */

const articleFiles = {

    "agriculture":
        "articles/agriculture.md",

    "oxygen":
        "articles/oxygen-park.md",

    "history":
        "articles/jalgaon-history.md",

    "jalgaon-district-information":
        "articles/jalgaon-district-information.md",

    "jalgaon-news-today":
        "articles/jalgaon-news-today.md",

    "jalgaon-city-news":
        "articles/jalgaon-city-news.md",

    "jalgaon-government-schemes":
        "articles/jalgaon-government-schemes.md",

    "jalgaon-education-job-news":
        "articles/jalgaon-education-job-news.md",

    "jalgaon-weather-news":
        "articles/jalgaon-weather-news.md",

    "banana-news":
        "articles/banana-news.md"

};


/* =====================================================
   LOAD ARTICLE
===================================================== */

async function loadArticle(){

    const box =
        document.getElementById("article");


    if(!id){

        showError(
            "Article Not Found",
            "URL मध्ये article ID नाही."
        );

        return;
    }


    const file =
        articleFiles[id];


    if(!file){

        showError(
            "Article Not Found",
            "हा article उपलब्ध नाही."
        );

        return;
    }


    try{

        const response =
            await fetch(file);


        if(!response.ok){

            throw new Error(
                "Article file not found"
            );

        }


        const markdown =
            await response.text();


        const data =
            parseMarkdown(markdown);


        document.title =
            data.title +
            " | Jalgaon Zone";


        updateMeta(
            data.description ||
            data.title
        );


        box.innerHTML = `

            <article class="article">

                ${
                    data.image
                    ?
                    `
                    <img
                        src="${data.image}"
                        alt="${escapeHTML(data.title)}"
                        id="articleImage"
                    >
                    `
                    :
                    ""
                }

                <div class="content">

                    ${
                        data.category
                        ?
                        `
                        <div class="category">
                            ${escapeHTML(data.category)}
                        </div>
                        `
                        :
                        ""
                    }

                    <h1>
                        ${escapeHTML(data.title)}
                    </h1>

                    ${
                        data.date
                        ?
                        `
                        <div class="date">
                            Published:
                            ${escapeHTML(data.date)}
                        </div>
                        `
                        :
                        ""
                    }

                    <div class="article-body">

                        ${marked.parse(data.content)}

                    </div>

                    <a
                        href="index.html"
                        class="back"
                    >
                        ← Back to Jalgaon Zone
                    </a>

                </div>

            </article>

        `;


        const image =
            document.getElementById(
                "articleImage"
            );


        if(image){

            image.onerror = function(){

                this.style.display = "none";

            };

        }

    }

    catch(error){

        console.error(error);

        showError(
            "Article Load Error",
            "Article load करताना समस्या आली."
        );

    }

}


/* =====================================================
   MARKDOWN PARSER
===================================================== */

function parseMarkdown(markdown){

    const lines =
        markdown.split("\n");


    const data = {

        title:"",
        category:"",
        date:"",
        image:"",
        description:"",
        content:""

    };


    let contentStart = 0;


    for(
        let i = 0;
        i < lines.length;
        i++
    ){

        const line =
            lines[i].trim();


        if(
            line.startsWith("title:")
        ){

            data.title =
                cleanValue(
                    line.substring(6)
                );

            contentStart = i + 1;

        }

        else if(
            line.startsWith("category:")
        ){

            data.category =
                cleanValue(
                    line.substring(9)
                );

            contentStart = i + 1;

        }

        else if(
            line.startsWith("date:")
        ){

            data.date =
                cleanValue(
                    line.substring(5)
                );

            contentStart = i + 1;

        }

        else if(
            line.startsWith("image:")
        ){

            data.image =
                cleanValue(
                    line.substring(6)
                );

            contentStart = i + 1;

        }

        else if(
            line.startsWith("description:")
        ){

            data.description =
                cleanValue(
                    line.substring(12)
                );

            contentStart = i + 1;

        }

        else if(
            line === "---"
        ){

            contentStart = i + 1;

            break;

        }

    }


    data.content =
        lines
        .slice(contentStart)
        .join("\n");


    return data;

}


/* =====================================================
   CLEAN VALUE
===================================================== */

function cleanValue(value){

    value =
        value.trim();


    if(
        (
            value.startsWith('"') &&
            value.endsWith('"')
        )
        ||
        (
            value.startsWith("'") &&
            value.endsWith("'")
        )
    ){

        value =
            value.substring(
                1,
                value.length - 1
            );

    }


    return value;

}


/* =====================================================
   META DESCRIPTION
===================================================== */

function updateMeta(description){

    const meta =
        document.querySelector(
            'meta[name="description"]'
        );


    if(meta){

        meta.setAttribute(
            "content",
            description +
            " | Jalgaon Zone"
        );

    }

}


/* =====================================================
   ERROR
===================================================== */

function showError(title,message){

    document.getElementById(
        "article"
    ).innerHTML = `

        <div class="error">

            <h2>
                ${escapeHTML(title)}
            </h2>

            <p>
                ${escapeHTML(message)}
            </p>

            <a
                href="index.html"
                class="back"
            >
                ← Home
            </a>

        </div>

    `;

}


/* =====================================================
   SECURITY
===================================================== */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   START
===================================================== */

loadArticle();

</script>

</body>

</html>
