/* =====================================================
   GET ARTICLE ID FROM URL
===================================================== */

const params =
new URLSearchParams(window.location.search);

const articleId =
params.get("id");



/* =====================================================
   ARTICLE AREA
===================================================== */

const articleArea =
document.getElementById("articleArea");



/* =====================================================
   SHOW ARTICLE
===================================================== */

function showArticle(article){

    document.title =
    article.title + " | Jalgaon Zone";


    /* Update description */

    const metaDescription =
    document.querySelector(
        'meta[name="description"]'
    );

    if(metaDescription){

        metaDescription.setAttribute(
            "content",
            article.description ||
            article.title
        );

    }


    articleArea.innerHTML = `

        <div class="article-container">

            <article class="article-card">


                <!-- IMAGE -->

                <img
                    src="${article.image}"
                    alt="${article.title}"
                    class="article-image"
                    onerror="handleImageError(this)"
                >


                <div
                    class="image-error"
                >
                    📷 या लेखाची प्रतिमा सध्या उपलब्ध नाही.
                </div>


                <!-- CONTENT -->

                <div class="article-content">


                    <span class="category">

                        ${article.category}

                    </span>


                    <h1 class="article-title">

                        ${article.title}

                    </h1>


                    <div class="article-date">

                        प्रकाशित:
                        ${article.date}

                    </div>


                    <div class="article-body">

                        ${article.content}

                    </div>


                    <!-- ACTIONS -->

                    <div class="article-actions">


                        <a
                            href="index.html"
                            class="btn back-btn"
                        >

                            ← Jalgaon Zone वर परत

                        </a>


                        <button
                            class="btn share-btn"
                            onclick="shareArticle()"
                        >

                            ↗ शेअर करा

                        </button>


                    </div>


                </div>

            </article>

        </div>

    `;

}



/* =====================================================
   IMAGE ERROR
===================================================== */

function handleImageError(image){

    image.style.display = "none";

    const errorBox =
    image.nextElementSibling;

    if(errorBox){

        errorBox.style.display = "block";

    }

}



/* =====================================================
   ARTICLE NOT FOUND
===================================================== */

function showNotFound(){

    document.title =
    "Article Not Found | Jalgaon Zone";


    articleArea.innerHTML = `

        <div class="not-found">

            <h1>
                लेख सापडला नाही
            </h1>


            <p>
                तुम्ही उघडलेला लेख उपलब्ध नाही
                किंवा URL चुकीचा आहे.
            </p>


            <a
                href="index.html"
                class="btn back-btn"
            >

                ← मुख्यपृष्ठावर जा

            </a>

        </div>

    `;

}



/* =====================================================
   SHARE ARTICLE
===================================================== */

function shareArticle(){

    const shareData = {

        title:
        document.title,

        text:
        "Jalgaon Zone वरील हा लेख वाचा.",

        url:
        window.location.href

    };


    if(
        navigator.share
    ){

        navigator.share(
            shareData
        ).catch(
            () => {}
        );

    }

    else{

        navigator.clipboard
        .writeText(
            window.location.href
        )
        .then(
            () => {

                alert(
                    "Article link copy झाला!"
                );

            }
        )
        .catch(
            () => {

                alert(
                    "Link: " +
                    window.location.href
                );

            }
        );

    }

}



/* =====================================================
   LOAD ARTICLE
===================================================== */

if(

    articleId &&
    Object.prototype.hasOwnProperty.call(
        articles,
        articleId
    )

){

    showArticle(
        articles[articleId]
    );

}

else{

    showNotFound();

}



/* =====================================================
   CURRENT YEAR
===================================================== */

document.getElementById(
    "year"
).textContent =
new Date().getFullYear();


</script>
