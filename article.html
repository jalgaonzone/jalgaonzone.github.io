========================= */

/* =========================

========================= */

/* =========================

h1{

h2{

    color:#111;

    font-size:24px;

p{

    margin:12px 0;

}


ul{

    margin:15px 0;

}


li{

    margin:6px 0;

/* =========================
   BACK BUTTON
========================= */

.back{

    display:inline-block;

    margin-top:30px;

    color:#f4511e;

    font-weight:bold;

    text-decoration:none;

}


.back:hover{

    text-decoration:underline;

}


/* =========================
   ERROR
========================= */

.error{

    background:white;

    padding:40px;

    text-align:center;

    border-radius:12px;

    box-shadow:
    0 4px 20px rgba(0,0,0,.08);

.error h2{

    margin-top:0;

}


/* =========================
   FOOTER
========================= */

footer{

    background:#111;

    color:#ccc;

    text-align:center;

    padding:25px;

}


footer strong{

    color:#f4511e;

}


/* =========================
   MOBILE
========================= */

    .nav{

    .logo{

        font-size:27px;

    h2{

    }


    .content{

        padding:20px;

    }


    .article img{

        max-height:350px;

/* =====================================================
   LOAD ARTICLE
===================================================== */

function loadArticle(){


    /* GET URL */

    const params =
    new URLSearchParams(
        window.location.search
    );


    /* GET ID */

    const id =
    params.get("id");


    /* ARTICLE BOX */

    const box =
    document.getElementById("article");


    console.log(
        "Article ID:",
        id
    );


    /* =================================================
       NO ID
    ================================================= */

    if(!id){

        box.innerHTML = `

            <div class="error">

                <h2>
                Article Not Found
                </h2>

                <p>
                URL मध्ये article ID नाही.
                </p>

                <a
                    href="index.html"
                    class="back"
                >

                    ← Home

                </a>

            </div>

        `;

        return;

    }



    /* =================================================
       FIND ARTICLE
    ================================================= */

    const data =
    articles[id];



    /* =================================================
       ARTICLE DOES NOT EXIST
    ================================================= */

    if(!data){

        box.innerHTML = `

            <div class="error">

                <h2>
                Article Not Found
                </h2>

                <p>
                हा article उपलब्ध नाही.
                </p>

                <a
                    href="index.html"
                    class="back"
                >

                    ← Home

                </a>

            </div>

        `;

        return;

    }



    /* =================================================
       CHANGE PAGE TITLE
    ================================================= */

    document.title =
    data.title +
    " | Jalgaon Zone";



    /* =================================================
       DISPLAY ARTICLE
    ================================================= */

    box.innerHTML = `

        <article class="article">


            <img
                src="${data.image}"
                alt="${data.title}"
                onerror="showImageError(this)"
            >


            <div class="content">


                <div class="category">

                    ${data.category}

                </div>


                <h1>

                    ${data.title}

                </h1>


                <div class="date">

                    Published:
                    ${data.date}

                </div>


                ${data.content}


                <a
                    href="index.html"
                    class="back"
                >

                    ← Back to Jalgaon Zone

                </a>


            </div>

        </article>

    `;

}



/* =====================================================
   IMAGE ERROR
===================================================== */

function showImageError(image){

    image.style.display = "none";


    const message =
    document.createElement("div");


    message.style.padding =
    "20px";


    message.style.textAlign =
    "center";


    message.style.background =
    "#fff3f0";


    message.style.color =
    "#d84315";


    message.innerHTML = `
        Image could not be loaded.
        Please check the filename in GitHub.
    `;


    image.parentNode.insertBefore(
        message,
        image
    );

}



/* =====================================================
