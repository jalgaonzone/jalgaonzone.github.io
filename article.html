<!DOCTYPE html>
<html lang="mr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Jalgaon Zone Article</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  background:#f5f6f8;
  color:#222;
  line-height:1.8;
}

header{
  background:#111;
  color:white;
}

.navbar{
  max-width:1100px;
  margin:auto;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

.logo span{
  color:#f4511e;
}

.home{
  color:white;
  text-decoration:none;
}

.home:hover{
  color:#f4511e;
}

.article-container{
  max-width:900px;
  margin:40px auto;
  padding:0 20px;
}

.article{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.article-image{
  width:100%;
  max-height:480px;
  object-fit:cover;
  display:block;
}

.article-content{
  padding:35px;
}

.category{
  display:inline-block;
  background:#fff0ea;
  color:#f4511e;
  padding:5px 12px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
}

.article-title{
  font-size:38px;
  line-height:1.3;
  margin:15px 0;
}

.meta{
  color:#777;
  margin-bottom:25px;
  font-size:14px;
}

.article-content h1{
  font-size:32px;
  margin:25px 0 10px;
}

.article-content h2{
  font-size:26px;
  margin:25px 0 10px;
}

.article-content h3{
  font-size:21px;
  margin:20px 0 8px;
}

.article-content p{
  margin:12px 0;
}

.article-content ul,
.article-content ol{
  padding-left:25px;
  margin:15px 0;
}

.article-content li{
  margin:7px 0;
}

.article-content img{
  max-width:100%;
  border-radius:8px;
}

.back{
  display:inline-block;
  margin-top:30px;
  color:#f4511e;
  font-weight:bold;
  text-decoration:none;
}

.back:hover{
  text-decoration:underline;
}

.error{
  background:white;
  padding:40px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
}

footer{
  margin-top:50px;
  background:#111;
  color:#ccc;
  text-align:center;
  padding:30px 20px;
}

@media(max-width:700px){

  .navbar{
    padding:15px;
  }

  .article-title{
    font-size:28px;
  }

  .article-content{
    padding:22px;
  }

}

</style>

</head>

<body>


<header>

<div class="navbar">

<div class="logo">
Jalgaon <span>Zone</span>
</div>

<a href="index.html" class="home">
← Home
</a>

</div>

</header>


<main class="article-container">

<div id="articleArea">

<div class="error">

<h2>Loading article...</h2>

<p>कृपया थोडा वेळ प्रतीक्षा करा.</p>

</div>

</div>

</main>


<footer>

<p>
© 2026 Jalgaon Zone
</p>

</footer>


<script>

/*
========================================
ARTICLE SYSTEM
========================================

URL:

article.html?id=agriculture

article.html?id=oxygen

*/

const articles = {

  agriculture: "agriculture.md",

  oxygen: "oxygen-park.md"

};


async function loadArticle(){

  const params =
  new URLSearchParams(window.location.search);

  const id =
  params.get("id");


  const area =
  document.getElementById("articleArea");


  if(!id){

    showError(
      "Article ID missing",
      "कृपया योग्य article link वापरा."
    );

    return;
  }


  const file =
  articles[id];


  if(!file){

    showError(
      "Article Not Found",
      "हा article उपलब्ध नाही."
    );

    return;
  }


  try{

    const response =
    await fetch(
      "articles/" + file + "?v=" + Date.now()
    );


    if(!response.ok){

      throw new Error(
        "HTTP " + response.status
      );

    }


    const text =
    await response.text();


    if(!text.trim()){

      throw new Error(
        "Article file is empty"
      );

    }


    const data =
    parseMarkdown(text);


    document.title =
    data.title + " | Jalgaon Zone";


    let imageHTML = "";

    if(data.image){

      imageHTML = `
        <img
          src="${data.image}"
          class="article-image"
          alt="${escapeHTML(data.title)}"
          onerror="this.style.display='none'"
        >
      `;

    }


    area.innerHTML = `

      <article class="article">

        ${imageHTML}

        <div class="article-content">

          <span class="category">
            ${escapeHTML(data.category)}
          </span>

          <h1 class="article-title">
            ${escapeHTML(data.title)}
          </h1>

          <div class="meta">
            Published: ${escapeHTML(data.date)}
          </div>

          <div class="article-body">
            ${marked.parse(data.body)}
          </div>

          <a
            href="index.html"
            class="back"
          >
            ← Back to Jalgaon Zone
          </a>

        </div>

      </article>

    `;

  }

  catch(error){

    console.error(error);

    showError(
      "Article Load Failed",
      "Article file सापडत नाही. GitHub मध्ये articles folder आणि filename तपासा."
    );

  }

}


function parseMarkdown(text){

  let title = "";
  let category = "";
  let date = "";
  let image = "";
  let body = text;


  /*
  Front matter:

  ---
  title: "..."
  category: "..."
  date: "..."
  image: "..."
  ---
  */

  const match =
  text.match(
    /^---\s*([\s\S]*?)\s*---\s*([\s\S]*)$/m
  );


  if(match){

    const frontMatter =
    match[1];

    body =
    match[2];


    const titleMatch =
    frontMatter.match(
      /^title:\s*["']?([\s\S]*?)["']?\s*$/m
    );

    const categoryMatch =
    frontMatter.match(
      /^category:\s*["']?([\s\S]*?)["']?\s*$/m
    );

    const dateMatch =
    frontMatter.match(
      /^date:\s*["']?([\s\S]*?)["']?\s*$/m
    );

    const imageMatch =
    frontMatter.match(
      /^image:\s*["']?([\s\S]*?)["']?\s*$/m
    );


    title =
    titleMatch
      ? titleMatch[1].trim()
      : "";

    category =
    categoryMatch
      ? categoryMatch[1].trim()
      : "";

    date =
    dateMatch
      ? dateMatch[1].trim()
      : "";

    image =
    imageMatch
      ? imageMatch[1].trim()
      : "";

  }


  /*
  Fallback:
  If title is not in front matter,
  use first # heading.
  */

  if(!title){

    const heading =
    body.match(/^#\s+(.+)$/m);

    if(heading){
      title =
      heading[1].trim();
    }

  }


  if(!category){
    category = "Jalgaon Zone";
  }


  if(!date){
    date = "Jalgaon Zone";
  }


  return {
    title,
    category,
    date,
    image,
    body
  };

}


function showError(title,message){

  document.getElementById("articleArea").innerHTML = `

    <div class="error">

      <h2>${escapeHTML(title)}</h2>

      <p>${escapeHTML(message)}</p>

      <br>

      <a
        href="index.html"
        class="back"
      >
        ← Go Home
      </a>

    </div>

  `;

}


function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


loadArticle();

</script>

</body>

</html>
