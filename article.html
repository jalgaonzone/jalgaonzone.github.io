/* =====================================================
   LOAD ARTICLE
===================================================== */

function loadArticle(){

    const params =
    new URLSearchParams(
        window.location.search
    );

    const id =
    params.get("id");

    const box =
    document.getElementById("article");


    if(!id){

        box.innerHTML = `

            <div class="error">

                <h2>
                    Article Not Found
                </h2>

                <p>
                    URL मध्ये article ID नाही.
                </p>

                <a
                    href="index.html"
                    class="back"
                >
                    ← Home
                </a>

            </div>

        `;

        return;
    }


    const data =
    articles[id];


    if(!data){

        box.innerHTML = `

            <div class="error">

                <h2>
                    Article Not Found
                </h2>

                <p>
                    हा article उपलब्ध नाही.
                </p>

                <a
                    href="index.html"
                    class="back"
                >
                    ← Home
                </a>

            </div>

        `;

        return;
    }


    document.title =
    data.title +
    " | Jalgaon Zone";


    const metaDescription =
    document.querySelector(
        'meta[name="description"]'
    );


    if(metaDescription){

        metaDescription.setAttribute(
            "content",
            data.description ||
            data.title +
            " | Jalgaon Zone"
        );

    }


    box.innerHTML = `

        <article class="article">

            <img
                src="${data.image}"
                alt="${data.title}"
                id="articleImage"
            >

            <div class="content">

                <div class="category">
                    ${data.category}
                </div>

                <h1>
                    ${data.title}
                </h1>

                <div class="date">
                    Published:
                    ${data.date}
                </div>

                ${data.content}

                <a
                    href="index.html"
                    class="back"
                >
                    ← Back to Jalgaon Zone
                </a>

            </div>

        </article>

    `;


    const image =
    document.getElementById(
        "articleImage"
    );


    image.onerror = function(){

        this.style.display = "none";

        const error =
        document.createElement("div");

        error.style.padding = "25px";
        error.style.textAlign = "center";
        error.style.background = "#fff3f0";
        error.style.color = "#d84315";
        error.style.fontWeight = "bold";

        error.innerHTML = `
            Article image could not be loaded.
            <br>
            कृपया GitHub मध्ये image filename तपासा.
        `;

        this.parentNode.insertBefore(
            error,
            this
        );

    };

}


/* =====================================================
   START
===================================================== */
