<!DOCTYPE html>
<html lang="mr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Jalgaon Zone</title>

<meta name="description" content="Jalgaon Zone">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script src="articles-data.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Devanagari",sans-serif;
    background:#f5f7fa;
    color:#222;
}

header{
    background:linear-gradient(135deg,#ff6a00,#111);
    color:white;
    padding:25px 15px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:32px;
}

header p{
    margin:8px 0 0;
    opacity:.9;
}

.container{
    max-width:900px;
    margin:30px auto;
    padding:0 15px;
}

.article{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.article-image{
    width:100%;
    max-height:450px;
    object-fit:cover;
    display:block;
}

.article-content{
    padding:30px;
}

.category{
    display:inline-block;
    background:#ff6a00;
    color:white;
    padding:6px 12px;
    border-radius:20px;
    font-size:14px;
    margin-bottom:12px;
}

.article-content h1{
    font-size:34px;
    line-height:1.3;
    margin:10px 0;
}

.date{
    color:#777;
    font-size:14px;
    margin-bottom:25px;
}

.article-body{
    font-size:18px;
    line-height:1.8;
}

.article-body h2{
    font-size:26px;
    margin-top:30px;
    color:#222;
}

.article-body h3{
    font-size:22px;
}

.article-body p{
    margin:15px 0;
}

.article-body ul,
.article-body ol{
    padding-left:25px;
}

.article-body img{
    max-width:100%;
    border-radius:10px;
}

.back{
    display:inline-block;
    margin-top:30px;
    padding:10px 18px;
    background:#111;
    color:white;
    text-decoration:none;
    border-radius:8px;
}

.error{
    text-align:center;
    padding:60px 20px;
    color:#b00020;
}

footer{
    text-align:center;
    padding:30px;
    color:#777;
}

@media(max-width:600px){

    header h1{
        font-size:26px;
    }

    .article-content{
        padding:20px;
    }

    .article-content h1{
        font-size:27px;
    }

    .article-body{
        font-size:17px;
    }

}

</style>

</head>


<body>

<header>

<h1>Jalgaon Zone</h1>

<p>जळगावची बातमी • शेती • इतिहास • शिक्षण • रोजगार</p>

</header>


<main class="container">

<article class="article">

<img
id="articleImage"
class="article-image"
alt=""
>

<div class="article-content">

<div
id="category"
class="category">
</div>

<h1 id="title">
लोड होत आहे...
</h1>

<div
id="date"
class="date">
</div>

<div
id="description"
class="date">
</div>

<div
id="articleBody"
class="article-body">
लोड होत आहे...
</div>

<a
href="index.html"
class="back">
← Jalgaon Zone वर परत जा
</a>

</div>

</article>

</main>


<footer>

© 2026 Jalgaon Zone

</footer>


<script>

function escapeHTML(value){

    return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


async function loadArticle(){

    const params =
        new URLSearchParams(window.location.search);

    const id = params.get("id");


    if(!id){

        showError("Article ID सापडला नाही.");
        return;

    }


    const article =
        articles.find(item => item.id === id);


    if(!article){

        showError("Article सापडला नाही.");
        return;

    }


    document.title =
        article.title + " | Jalgaon Zone";


    document.querySelector(
        'meta[name="description"]'
    ).setAttribute(
        "content",
        article.description || article.title
    );


    document.getElementById("category")
        .textContent =
        article.category || "Jalgaon Zone";


    document.getElementById("title")
        .textContent =
        article.title;


    document.getElementById("date")
        .textContent =
        article.date || "";


    document.getElementById("description")
        .textContent =
        article.description || "";


    const image =
        document.getElementById("articleImage");


    if(article.image){

        image.src = article.image;

        image.alt = article.title;

        image.onerror = function(){

            image.style.display = "none";

        };

    }else{

        image.style.display = "none";

    }


    try{

        const response =
            await fetch(article.file);


        if(!response.ok){

            throw new Error(
                "Markdown file not found"
            );

        }


        let markdown =
            await response.text();


        /*
        First H1 remove करा.
        Example:

        # जळगाव जिल्ह्यातील आजच्या प्रमुख बातम्या
        */

        let lines =
            markdown.split(/\r?\n/);


        if(
            lines.length > 0 &&
            lines[0].trim().startsWith("# ")
        ){

            lines.shift();

        }


        /*
        Date line remove करा.

        **दिनांक:** 24 सप्टेंबर 2026
        */

        while(
            lines.length &&
            lines[0].trim() === ""
        ){

            lines.shift();

        }


        if(
            lines.length &&
            /^\*\*दिनांक:\*\*/.test(
                lines[0].trim()
            )
        ){

            lines.shift();

        }


        while(
            lines.length &&
            lines[0].trim() === ""
        ){

            lines.shift();

        }


        markdown =
            lines.join("\n");


        document.getElementById(
            "articleBody"
        ).innerHTML =
            marked.parse(markdown);


    }catch(error){

        console.error(error);

        showError(
            "Article content load होत नाही."
        );

    }

}


function showError(message){

    document.querySelector(".article")
    .innerHTML = `

        <div class="error">

            <h2>⚠️ ${escapeHTML(message)}</h2>

            <p>
                कृपया पुन्हा प्रयत्न करा.
            </p>

            <a
                href="index.html"
                class="back">
                ← Home
            </a>

        </div>

    `;

}


loadArticle();

</script>

</body>

</html>
