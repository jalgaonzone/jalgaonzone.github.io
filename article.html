<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Jalgaon Zone Article</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f5f7;
    color:#222;
    line-height:1.7;
}

header{
    background:#111;
    color:white;
    padding:18px 20px;
    position:sticky;
    top:0;
    z-index:100;
}

.header-inner{
    max-width:1000px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.logo span{
    color:#f4511e;
}

.home{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.home:hover{
    color:#f4511e;
}

.container{
    max-width:950px;
    margin:40px auto;
    padding:0 18px;
}

.article{
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.back{
    display:inline-block;
    margin-bottom:20px;
    color:#f4511e;
    text-decoration:none;
    font-weight:bold;
}

.category{
    display:inline-block;
    background:#f4511e;
    color:white;
    padding:6px 13px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}

h1{
    font-size:42px;
    line-height:1.25;
    margin:18px 0 10px;
}

.date{
    color:#777;
    margin-bottom:25px;
}

.cover{
    width:100%;
    max-height:520px;
    object-fit:cover;
    border-radius:12px;
    margin-bottom:30px;
}

.content{
    font-size:18px;
}

.content h2{
    margin-top:30px;
}

.content h3{
    margin-top:25px;
}

.content img{
    max-width:100%;
    height:auto;
    border-radius:10px;
}

.content a{
    color:#f4511e;
}

.loading,
.error{
    background:white;
    padding:30px;
    border-radius:12px;
    text-align:center;
}

.error{
    color:#b00000;
}

footer{
    text-align:center;
    background:#111;
    color:#aaa;
    padding:30px;
    margin-top:50px;
}

@media(max-width:600px){

    .header-inner{
        gap:10px;
    }

    .logo{
        font-size:21px;
    }

    h1{
        font-size:29px;
    }

    .article{
        padding:20px;
    }

    .content{
        font-size:16px;
    }

}

</style>

</head>

<body>


<header>

<div class="header-inner">

<div class="logo">
Jalgaon <span>Zone</span>
</div>

<a href="index.html" class="home">
Home
</a>

</div>

</header>


<main class="container">

<a href="index.html" class="back">
← Back to Jalgaon Zone
</a>


<div id="loading" class="loading">

Article loading...

</div>


<article
id="article"
class="article"
style="display:none;"
>

<div
id="category"
class="category"
>
</div>


<h1 id="title"></h1>


<div
id="date"
class="date"
></div>


<img
id="cover"
class="cover"
style="display:none;"
>


<div
id="content"
class="content"
></div>

</article>


<div
id="error"
class="error"
style="display:none;"
>

<h2>Article load nahi ho raha</h2>

<p>
Please article filename aur GitHub folder check karo.
</p>

<p id="errorText"></p>

</div>

</main>


<footer>

<p>
<strong>Jalgaon Zone</strong>
</p>

<p>
© 2026 Jalgaon Zone
</p>

</footer>


<script>

const params =
new URLSearchParams(
window.location.search
);

const fileParam =
params.get("file");


function parseMarkdown(text){

    text =
    text.replace(/^\uFEFF/, "");

    let data = {};

    let body = text;


    if(text.trim().startsWith("---")){

        const lines =
        text.trim().split(/\r?\n/);

        let endIndex = -1;


        for(
            let i = 1;
            i < lines.length;
            i++
        ){

            if(
                lines[i].trim() === "---"
            ){

                endIndex = i;
                break;

            }

        }


        if(endIndex !== -1){

            const frontMatter =
            lines.slice(
                1,
                endIndex
            );

            body =
            lines
            .slice(endIndex + 1)
            .join("\n")
            .trim();


            frontMatter.forEach(line => {

                const index =
                line.indexOf(":");

                if(index === -1){
                    return;
                }

                const key =
                line
                .slice(0,index)
                .trim();


                let value =
                line
                .slice(index + 1)
                .trim();


                value =
                value.replace(
                    /^["']|["']$/g,
                    ""
                );


                data[key] = value;

            });

        }

    }


    return {
        data:data,
        body:body
    };

}


function imageUrl(image){

    if(!image){
        return "";
    }

    if(
        image.startsWith("http://") ||
        image.startsWith("https://")
    ){

        return image;

    }


    if(image.startsWith("/")){

        return image;

    }


    return image;

}


async function loadArticle(){

    if(!fileParam){

        showError(
            "Article filename URL मध्ये मिळाले नाही."
        );

        return;

    }


    try{

        /*
        IMPORTANT:
        Article आता GitHub Pages च्या
        local articles folder मधून load होईल.
        */

        const articleUrl =
        "articles/" +
        encodeURIComponent(fileParam);


        console.log(
            "Loading:",
            articleUrl
        );


        const response =
        await fetch(
            articleUrl,
            {
                cache:"no-cache"
            }
        );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status +
                " - Article file सापडली नाही."
            );

        }


        const markdown =
        await response.text();


        if(!markdown.trim()){

            throw new Error(
                "Article file empty आहे."
            );

        }


        const parsed =
        parseMarkdown(markdown);


        const data =
        parsed.data;

        const body =
        parsed.body;


        document.title =
        (data.title || "Article") +
        " | Jalgaon Zone";


        document
        .getElementById("title")
        .textContent =
        data.title ||
        "Jalgaon Zone";


        document
        .getElementById("category")
        .textContent =
        data.category ||
        "Jalgaon";


        if(data.date){

            document
            .getElementById("date")
            .textContent =
            "Published: " +
            data.date;

        }else{

            document
            .getElementById("date")
            .style.display =
            "none";

        }


        if(data.image){

            const cover =
            document
            .getElementById("cover");


            cover.src =
            imageUrl(data.image);


            cover.style.display =
            "block";


            cover.onerror =
            function(){

                this.style.display =
                "none";

            };

        }


        document
        .getElementById("content")
        .innerHTML =
        marked.parse(body);


        document
        .getElementById("loading")
        .style.display =
        "none";


        document
        .getElementById("article")
        .style.display =
        "block";


    }catch(error){

        console.error(error);

        showError(
            error.message
        );

    }

}


function showError(message){

    document
    .getElementById("loading")
    .style.display =
    "none";


    document
    .getElementById("error")
    .style.display =
    "block";


    document
    .getElementById("errorText")
    .textContent =
    message;

}


loadArticle();

</script>

</body>

</html>
