<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jalgaon Zone</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,"Noto Sans Devanagari",sans-serif;
    background:#f5f5f5;
    color:#222;
    line-height:1.8;
}

header{
    background:#111;
    color:white;
    padding:18px 20px;
}

.nav{
    max-width:1000px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.logo span{
    color:#f4511e;
}

.home{
    color:white;
    text-decoration:none;
}

.container{
    max-width:900px;
    margin:35px auto;
    padding:0 15px;
}

.article{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 20px rgba(0,0,0,.1);
}

.article img{
    width:100%;
    max-height:500px;
    object-fit:cover;
    display:block;
}

.content{
    padding:30px;
}

.category{
    color:#f4511e;
    font-weight:bold;
}

h1{
    font-size:38px;
    line-height:1.4;
    margin:12px 0;
}

.date{
    color:#777;
    margin-bottom:25px;
}

h2{
    margin-top:25px;
    margin-bottom:8px;
}

p{
    margin:12px 0;
}

.back{
    display:inline-block;
    margin-top:30px;
    color:#f4511e;
    font-weight:bold;
    text-decoration:none;
}

.error{
    background:white;
    padding:40px;
    text-align:center;
    border-radius:12px;
}

footer{
    margin-top:50px;
    background:#111;
    color:#ccc;
    text-align:center;
    padding:25px;
}

@media(max-width:600px){
    h1{
        font-size:27px;
    }

    .content{
        padding:20px;
    }
}
</style>
</head>

<body>

<header>
    <div class="nav">
        <div class="logo">
            Jalgaon <span>Zone</span>
        </div>

        <a href="index.html" class="home">
            ← Home
        </a>
    </div>
</header>

<div class="container">

<div id="article"></div>

</div>

<footer>
    © 2026 Jalgaon Zone
</footer>

<script>

const articles = {

    agriculture: {
        title: "शेतकऱ्यांसाठी खुशखबर! सूक्ष्म सिंचनासाठी मिळणार ९०% पर्यंत अनुदान",
        category: "Agriculture",
        date: "16 September 2026",
        image: "images/jalgaon.jpg",

        content: `
            <p>
            सूक्ष्म सिंचनाचा वापर करणाऱ्या पात्र शेतकऱ्यांसाठी
            अनुदानाची योजना उपलब्ध आहे.
            </p>

            <h2>किती अनुदान मिळू शकते?</h2>

            <p>
            पात्रता, प्रवर्ग आणि लागू योजनांनुसार अनुदानाचे
            प्रमाण बदलू शकते. काही प्रकरणांमध्ये अतिरिक्त
            लाभामुळे मोठ्या प्रमाणात आर्थिक सहाय्य मिळू शकते.
            </p>

            <h2>अर्ज कुठे करायचा?</h2>

            <p>
            अर्जासाठी महाराष्ट्राच्या MahaDBT Farmer Portal
            चा वापर केला जातो.
            </p>

            <h2>आवश्यक कागदपत्रे</h2>

            <ul>
                <li>आधार कार्ड</li>
                <li>7/12 उतारा</li>
                <li>8-A उतारा</li>
                <li>बँक पासबुक</li>
                <li>Farmer ID</li>
            </ul>

            <h2>महत्त्वाची सूचना</h2>

            <p>
            अनुदानाची टक्केवारी आणि पात्रतेचे नियम बदलू शकतात.
            अर्ज करण्यापूर्वी अधिकृत कृषी विभागाची माहिती तपासा.
            </p>
        `
    },

    oxygen: {
        title: "पाळधीत ऑक्सिजन पार्कचे भूमीपूजन",
        category: "Jalgaon News",
        date: "20 September 2026",
        image: "images/oxygen-park-news.png",

        content: `
            <p>
            जळगाव जिल्ह्यातील पाळधी खुर्द येथे ऑक्सिजन पार्क
            निर्मितीच्या उपक्रमाची सुरुवात करण्यात आली.
            </p>

            <h2>ऑक्सिजन पार्कचा उपक्रम</h2>

            <p>
            GPS मित्र परिवाराच्या माध्यमातून पर्यावरण संवर्धन
            आणि हरित परिसर निर्माण करण्याच्या उद्देशाने हा
            उपक्रम राबविण्यात येत आहे.
            </p>

            <h2>पर्यावरण संवर्धनाचे महत्त्व</h2>

            <p>
            वृक्षारोपण आणि हरित क्षेत्र वाढवणे पर्यावरणासाठी
            महत्त्वाचे आहे. अशा उपक्रमांमुळे नागरिकांमध्ये
            पर्यावरणाबाबत जागरूकता निर्माण होण्यास मदत होऊ शकते.
            </p>
        `
    }

};


function loadArticle(){

    const params = new URLSearchParams(
        window.location.search
    );

    const id = params.get("id");

    const box = document.getElementById("article");

    console.log("Article ID:", id);

    if(!id){

        box.innerHTML = `
            <div class="error">
                <h2>Article Not Found</h2>
                <p>URL मध्ये article ID नाही.</p>
                <a href="index.html" class="back">
                    ← Home
                </a>
            </div>
        `;

        return;
    }

    const data = articles[id];

    if(!data){

        box.innerHTML = `
            <div class="error">
                <h2>Article Not Found</h2>
                <p>हा article उपलब्ध नाही.</p>
                <a href="index.html" class="back">
                    ← Home
                </a>
            </div>
        `;

        return;
    }

    document.title = data.title + " | Jalgaon Zone";

    box.innerHTML = `

        <article class="article">

            <img
                src="${data.image}"
                alt="${data.title}"
                onerror="this.style.display='none';"
            >

            <div class="content">

                <div class="category">
                    ${data.category}
                </div>

                <h1>
                    ${data.title}
                </h1>

                <div class="date">
                    Published: ${data.date}
                </div>

                ${data.content}

                <a href="index.html" class="back">
                    ← Back to Jalgaon Zone
                </a>

            </div>

        </article>
    `;
}

loadArticle();

</script>

</body>
</html>
