<style>

/* =========================
   RESET
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


/* =========================
   BODY
========================= */

body{
    font-family:Arial,"Noto Sans Devanagari",sans-serif;
    background:#f5f5f5;
    color:#222;
    line-height:1.8;
}


/* =========================
   HEADER
========================= */

header{
    background:#111;
    color:white;
    padding:18px 20px;
}

.nav{
    max-width:1000px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.logo span{
    color:#f4511e;
}

.home{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.home:hover{
    color:#f4511e;
}


/* =========================
   CONTAINER
========================= */

.container{
    max-width:900px;
    margin:35px auto;
    padding:0 15px;
}


/* =========================
   ARTICLE
========================= */

.article{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 20px rgba(0,0,0,.10);
}


/* =========================
   ARTICLE IMAGE
========================= */

.article img{
    width:100%;
    max-height:500px;
    object-fit:cover;
    display:block;
}


/* =========================
   CONTENT
========================= */

.content{
    padding:30px;
}

.category{
    color:#f4511e;
    font-weight:bold;
    font-size:15px;
}

h1{
    font-size:38px;
    line-height:1.4;
    margin:12px 0;
}

.date{
    color:#777;
    margin-bottom:25px;
    font-size:14px;
}

h2{
    margin-top:25px;
    margin-bottom:8px;
    color:#111;
}

p{
    margin:12px 0;
}

ul{
    margin:15px 0;
    padding-left:25px;
}

li{
    margin:6px 0;
}


/* =========================
   BACK
========================= */

.back{
    display:inline-block;
    margin-top:30px;
    color:#f4511e;
    font-weight:bold;
    text-decoration:none;
}

.back:hover{
    text-decoration:underline;
}


/* =========================
   ERROR
========================= */

.error{
    background:white;
    padding:40px;
    text-align:center;
    border-radius:12px;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.error h2{
    margin-top:0;
}


/* =========================
   FOOTER
========================= */

footer{
    margin-top:50px;
    background:#111;
    color:#ccc;
    text-align:center;
    padding:25px;
}

footer strong{
    color:#f4511e;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .nav{
        gap:15px;
    }

    .logo{
        font-size:22px;
    }

    .home{
        font-size:14px;
    }

    .container{
        margin:20px auto;
        padding:0 10px;
    }

    h1{
        font-size:27px;
    }

    h2{
        font-size:21px;
    }

    .content{
        padding:20px;
    }

    .article img{
        max-height:350px;
    }

}

</style>

</head>

/* =====================================================
   LOAD ARTICLE
===================================================== */

function loadArticle(){

    const params =
    new URLSearchParams(
        window.location.search
    );

    const id =
    params.get("id");

    const box =
    document.getElementById("article");


    /* NO ID */

    if(!id){

        box.innerHTML = `

            <div class="error">

                <h2>
                Article Not Found
                </h2>

                <p>
                URL मध्ये article ID नाही.
                </p>

                <a
                    href="index.html"
                    class="back"
                >
                    ← Home
                </a>

            </div>

        `;

        return;
    }


    /* FIND ARTICLE */

    const data =
    articles[id];


    /* ARTICLE NOT FOUND */

    if(!data){

        box.innerHTML = `

            <div class="error">

                <h2>
                Article Not Found
                </h2>

                <p>
                हा article उपलब्ध नाही.
                </p>

                <a
                    href="index.html"
                    class="back"
                >
                    ← Home
                </a>

            </div>

        `;

        return;
    }


    /* PAGE TITLE */

    document.title =
    data.title +
    " | Jalgaon Zone";


    /* DISPLAY ARTICLE */

    box.innerHTML = `

        <article class="article">

            <img
                src="${data.image}"
                alt="${data.title}"
                id="articleImage"
            >

            <div class="content">

                <div class="category">
                    ${data.category}
                </div>

                <h1>
                    ${data.title}
                </h1>

                <div class="date">
                    Published:
                    ${data.date}
                </div>

                ${data.content}

                <a
                    href="index.html"
                    class="back"
                >
                    ← Back to Jalgaon Zone
                </a>

            </div>

        </article>

    `;


    /* IMAGE ERROR CHECK */

    const image =
    document.getElementById("articleImage");


    image.onerror = function(){

        this.style.display = "none";


        const error =
        document.createElement("div");


        error.style.padding = "25px";

        error.style.textAlign = "center";

        error.style.background = "#fff3f0";

        error.style.color = "#d84315";

        error.style.fontWeight = "bold";

        error.innerHTML = `
            Oxygen image could not be loaded.
            <br>
            GitHub filename:
            oxygen-park-newspng.jpg
        `;


        this.parentNode.insertBefore(
            error,
            this
        );

    };

}


/* =====================================================
   START
===================================================== */

loadArticle();
