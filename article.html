<style>

/* =========================
   BASIC
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;

body{

/* =========================
   HEADER
========================= */

header{

}

.logo{

.home{

/* =========================
   ARTICLE
========================= */

.article-container{

    padding:0 20px;
}

.article{
    background:white;
    border-radius:12px;
    overflow:hidden;

}

.article-image{
    width:100%;
    max-height:480px;
    object-fit:cover;
    display:block;
}

.article-content{
    padding:35px;
}


/* CATEGORY */

.category{
    display:inline-block;

    background:#fff0ea;
    color:#f4511e;

    padding:5px 12px;

    border-radius:20px;

    font-size:13px;
    font-weight:bold;
}


/* TITLE */

.article-title{
    font-size:38px;
    line-height:1.35;

    margin:15px 0;
}


/* DATE */

.meta{
    color:#777;
    font-size:14px;

    margin-bottom:25px;
}


/* CONTENT */

.article-content h2{
    font-size:27px;

    margin-top:28px;
    margin-bottom:10px;
}

.article-content h3{
    font-size:22px;

    margin-top:22px;
    margin-bottom:8px;
}

.article-content p{
    margin:12px 0;
}

.article-content ul,
.article-content ol{
    padding-left:25px;

    margin:15px 0;
}

.article-content li{
    margin:7px 0;
}


/* BACK BUTTON */

.back{
    display:inline-block;

    margin-top:30px;

    color:#f4511e;

    font-weight:bold;

    text-decoration:none;
}

.back:hover{
    text-decoration:underline;
}


/* ERROR */

.error{
    background:white;

    padding:40px;

    border-radius:12px;

    text-align:center;

    box-shadow:
    0 4px 20px rgba(0,0,0,.08);
}


/* FOOTER */

footer{
    margin-top:50px;

    background:#111;

    color:#ccc;

    text-align:center;

    padding:30px 20px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .navbar{
        padding:15px;
    }

    .article-title{
        font-size:28px;
    }

    .article-content{
        padding:22px;
    }

</style>

</head>

/* =========================================
   LOAD ARTICLE
========================================= */

function loadArticle(){

    const params =
    new URLSearchParams(
        window.location.search
    );


    const id =
    params.get("id");


    const area =
    document.getElementById(
        "articleArea"
    );


    /*
    No ID
    */

    if(!id){

        showError(
            "Article Not Found",
            "कृपया Home page वरून article उघडा."
        );

        return;
    }


    /*
    Find article
    */

    const article =
    articles[id];


    /*
    Article doesn't exist
    */

    if(!article){

        showError(
            "Article Not Found",
            "हा article उपलब्ध नाही."
        );

        return;
    }


    /*
    Change browser title
    */

    document.title =
    article.title +
    " | Jalgaon Zone";


    /*
    Display article
    */

    area.innerHTML = `

    <article class="article">


        <img

        src="${article.image}"

        class="article-image"

        alt="${escapeHTML(
            article.title
        )}"

        onerror="
        this.style.display='none'
        "

        >


        <div class="article-content">


            <span class="category">

            ${escapeHTML(
                article.category
            )}

            </span>


            <h1 class="article-title">

            ${escapeHTML(
                article.title
            )}

            </h1>


            <div class="meta">

            Published:
            ${escapeHTML(
                article.date
            )}

            </div>


            ${article.content}


            <a

            href="index.html"

            class="back"

            >

            ← Back to Jalgaon Zone

            </a>


        </div>


    </article>

    `;

}



/* =========================================
   ERROR MESSAGE
========================================= */

function showError(
    title,
    message
){

    document.getElementById(
        "articleArea"
    ).innerHTML = `

    <div class="error">

        <h2>
        ${escapeHTML(title)}
        </h2>

        <p>
        ${escapeHTML(message)}
        </p>

        <a

        href="index.html"

        class="back"

        >

        ← Go Home

        </a>

    </div>

    `;

}



/* =========================================
   SECURITY
========================================= */

function escapeHTML(text){

    return String(text)

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}



/* =========================================
   START
========================================= */
