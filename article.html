<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Article | Jalgaon Zone</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f5f6f8;

    color: #222;

    line-height: 1.7;
}


/* HEADER */

header {

    background: #111;

    color: white;

    position: sticky;

    top: 0;

    z-index: 1000;

    box-shadow:
        0 3px 15px rgba(0,0,0,0.2);
}

.header-inner {

    max-width: 1100px;

    margin: auto;

    padding: 16px 20px;

    display: flex;

    justify-content: space-between;

    align-items: center;
}

.logo {

    color: white;

    text-decoration: none;

    font-size: 25px;

    font-weight: bold;
}

.logo span {

    color: #f4511e;
}

.home-link {

    color: white;

    text-decoration: none;

    font-size: 14px;

    font-weight: bold;
}

.home-link:hover {

    color: #f4511e;
}


/* CONTAINER */

.container {

    max-width: 900px;

    margin: auto;

    padding: 45px 20px;
}


/* ARTICLE */

article {

    background: white;

    padding: 35px;

    border-radius: 16px;

    box-shadow:
        0 4px 20px rgba(0,0,0,0.08);
}

.category {

    display: inline-block;

    background: #f4511e;

    color: white;

    padding: 5px 12px;

    border-radius: 20px;

    font-size: 13px;
}

h1 {

    font-size: 40px;

    line-height: 1.25;

    margin: 15px 0 10px;
}

.date {

    color: #777;

    margin-bottom: 20px;

    font-size: 14px;
}

.cover {

    width: 100%;

    max-height: 520px;

    object-fit: cover;

    border-radius: 12px;

    margin: 15px 0 25px;
}

.content {

    font-size: 18px;
}

.content h2 {

    margin-top: 35px;

    font-size: 28px;
}

.content h3 {

    margin-top: 25px;
}

.content p {

    margin-bottom: 18px;
}

.content img {

    width: 100%;

    max-width: 100%;

    height: auto;

    border-radius: 12px;

    margin: 15px 0;
}

.content a {

    color: #f4511e;

    font-weight: bold;
}

.loading {

    text-align: center;

    padding: 60px;

    background: white;

    border-radius: 15px;
}

.error {

    background: white;

    padding: 35px;

    border-radius: 15px;

    text-align: center;

    color: #b00020;
}


/* MOBILE */

@media(max-width:600px) {

    article {

        padding: 22px;

    }

    h1 {

        font-size: 29px;

    }

    .content {

        font-size: 16px;

    }

    .header-inner {

        padding: 14px;

    }

}

</style>

</head>


<body>


<header>

<div class="header-inner">

<a
    href="index.html"
    class="logo"
>
Jalgaon <span>Zone</span>
</a>


<a
    href="index.html"
    class="home-link"
>
← Home
</a>

</div>

</header>



<main class="container">


<div
    id="loading"
    class="loading"
>
Loading article...
</div>



<article
    id="article"
    style="display:none;"
>


<div
    id="category"
    class="category"
>
Jalgaon
</div>


<h1
    id="title"
>
</h1>


<div
    id="date"
    class="date"
>
</div>


<img
    id="cover"
    class="cover"
    style="display:none;"
>


<div
    id="content"
    class="content"
>
</div>


</article>



<div
    id="error"
    class="error"
    style="display:none;"
>

<h2>
Article load nahi ho raha
</h2>

<p>
Please article file check karo.
</p>

<p id="errorMessage"></p>

</div>


</main>



<script>


/* =========================
   SETTINGS
========================= */

const REPO =
    "jalgaonzone/jalgaonzone.github.io";

const BRANCH =
    "main";


/* =========================
   URL PARAMETER
========================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const fileParam =
    params.get("file");


/* =========================
   PARSE MARKDOWN
========================= */

function parseMarkdown(text) {

    let data = {};

    let body = text;


    text =
        text.replace(
            /^\uFEFF/,
            ""
        );


    if (
        text
        .trim()
        .startsWith("---")
    ) {

        const lines =
            text
            .trim()
            .split(/\r?\n/);


        let endIndex = -1;


        for (
            let i = 1;
            i < lines.length;
            i++
        ) {

            if (
                lines[i].trim()
                === "---"
            ) {

                endIndex = i;

                break;

            }

        }


        if (endIndex !== -1) {

            const frontMatter =
                lines.slice(
                    1,
                    endIndex
                );


            body =
                lines
                .slice(
                    endIndex + 1
                )
                .join("\n")
                .trim();


            frontMatter.forEach(
                function(line) {

                    const index =
                        line.indexOf(":");


                    if (index === -1)
                        return;


                    const key =
                        line
                        .slice(0,index)
                        .trim();


                    let value =
                        line
                        .slice(index + 1)
                        .trim();


                    value =
                        value.replace(
                            /^["']|["']$/g,
                            ""
                        );


                    data[key] =
                        value;

                }
            );

        }

    }


    return {
        data: data,
        body: body
    };

}


/* =========================
   IMAGE PATH
========================= */

function imageUrl(image) {

    if (!image)
        return "";


    if (
        image.startsWith("http://") ||
        image.startsWith("https://")
    ) {

        return image;

    }


    if (
        image.startsWith("/")
    ) {

        return image;

    }


    return image;

}


/* =========================
   LOAD ARTICLE
========================= */

async function loadArticle() {


    if (!fileParam) {

        showError(
            "Article filename missing."
        );

        return;

    }


    try {


        const rawUrl =
            "https://raw.githubusercontent.com/" +
            REPO +
            "/" +
            BRANCH +
            "/articles/" +
            encodeURIComponent(
                fileParam
            );


        console.log(
            "Article URL:",
            rawUrl
        );


        const response =
            await fetch(
                rawUrl,
                {
                    cache: "no-cache"
                }
            );


        if (!response.ok) {

            throw new Error(
                "GitHub returned " +
                response.status
            );

        }


        const markdown =
            await response.text();


        if (!markdown.trim()) {

            throw new Error(
                "Article file is empty."
            );

        }


        const parsed =
            parseMarkdown(
                markdown
            );


        const data =
            parsed.data;


        const body =
            parsed.body;


        /* TITLE */

        document.title =
            (
                data.title ||
                "Article"
            ) +
            " | Jalgaon Zone";


        document
        .getElementById("title")
        .textContent =
            data.title ||
            "Jalgaon Zone";


        /* CATEGORY */

        document
        .getElementById("category")
        .textContent =
            data.category ||
            "Jalgaon";


        /* DATE */

        if (data.date) {

            document
            .getElementById("date")
            .textContent =
                "Published: " +
                data.date;

        } else {

            document
            .getElementById("date")
            .style.display =
                "none";

        }


        /* COVER */

        if (data.image) {

            const cover =
                document
                .getElementById("cover");


            cover.src =
                imageUrl(
                    data.image
                );


            cover.style.display =
                "block";


            cover.onerror =
                function() {

                    this.style.display =
                        "none";

                };

        }


        /* CONTENT */

        document
        .getElementById("content")
        .innerHTML =
            marked.parse(body);


        /* SHOW */

        document
        .getElementById("loading")
        .style.display =
            "none";


        document
        .getElementById("article")
        .style.display =
            "block";


    }

    catch(error) {

        console.error(
            "ARTICLE ERROR:",
            error
        );


        showError(
            error.message
        );

    }

}


/* =========================
   ERROR
========================= */

function showError(message) {

    document
    .getElementById("loading")
    .style.display =
        "none";


    document
    .getElementById("error")
    .style.display =
        "block";


    document
    .getElementById("errorMessage")
    .textContent =
        message;

}


loadArticle();

</script>


</body>

</html>
