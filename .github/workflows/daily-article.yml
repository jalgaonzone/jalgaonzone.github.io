          ls -lah articles/ | tail -25


          echo ""
          echo "===================================="
          echo "IMAGES"
          echo "===================================="

          ls -lah Images/ | tail -25


      # =====================================================
      # CHECK GIT CHANGES
      # =====================================================

      - name: Check changes
        run: |

          echo "Git status:"

          git status --short


      # =====================================================
      # COMMIT AND PUSH
      # =====================================================

      - name: Commit and Push
        run: |

          git config user.name \
            "Jalgaon Zone Bot"

          git config user.email \
            "actions@github.com"


          git add \
            articles/ \
            Images/ \
            articles-data.js


          if git diff --cached --quiet; then

              echo "No changes to commit."

              exit 0

          fi


          git commit \
            -m "Daily Jalgaon Zone articles and images"


          git push
