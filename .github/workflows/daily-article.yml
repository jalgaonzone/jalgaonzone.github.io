name: Daily Jalgaon Zone Articles

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-jalgaon-zone-articles
  cancel-in-progress: false

