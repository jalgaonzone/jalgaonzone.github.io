          def normalize_text(value):

              value = str(value)

              value = value.replace(
                  "\u200b",
                  ""
              )

              value = value.replace(
                  "\ufeff",
                  ""
              )

              value = re.sub(
                  r"\s+",
                  " ",
                  value
              )

              return value.strip()


          # =====================================================
          # LOAD EXISTING ARTICLE DATA
          # =====================================================

          def load_articles_data():

              data_file = "articles-data.js"

              if not os.path.exists(data_file):

                  return []


              try:

                  with open(
                      data_file,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      content = f.read()


                  start = content.find("[")

                  end = content.rfind("]")


                  if (
                      start == -1
                      or end == -1
                      or end <= start
                  ):

                      return []


                  array_text = content[
                      start:end + 1
                  ]


                  # Convert JavaScript-style keys:
                  #
                  # id: "abc"
                  #
                  # into:
                  #
                  # "id": "abc"

                  array_text = re.sub(
                      r'([{,]\s*)([A-Za-z_][A-Za-z0-9_]*)\s*:',
                      r'\1"\2":',
                      array_text
                  )


                  data = json.loads(
                      array_text
                  )


                  if isinstance(
                      data,
                      list
                  ):

                      print(
                          "Loaded articles-data.js:",
                          len(data),
                          "articles"
                      )

                      return data


              except Exception as error:

                  print(
                      "Could not load articles-data.js:",
                      error
                  )


              return []


