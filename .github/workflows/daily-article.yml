          # =====================================================
          # SLUG
          # =====================================================

          def make_slug(
              title,
              category,
              date_file
          ):

              transliteration = {

                  "जळगाव": "jalgaon",
                  "जिल्ह्यातील": "district",
                  "जिल्ह्याची": "district",
                  "शहराची": "city",
                  "शहर": "city",
                  "माहिती": "information",
                  "इतिहास": "history",
                  "कृषी": "agriculture",
                  "शेती": "agriculture",
                  "शेतकरी": "farmers",
                  "केळी": "banana",
                  "सरकारी": "government",
                  "योजना": "scheme",
                  "शिक्षण": "education",
                  "रोजगार": "jobs",
                  "पर्यटन": "tourism",
                  "स्थळे": "places",
                  "नोकरी": "jobs",
                  "विद्यार्थ्यांसाठी": "students",
                  "तंत्रज्ञान": "technology",
                  "सिंचन": "irrigation"
              }


              words = []


              for word in title.split():

                  clean = word.strip(
                      ".,!?()[]{}"
                  )

                  if clean in transliteration:

                      words.append(
                          transliteration[clean]
                      )


              if not words:

                  words = [
                      "jalgaon"
                  ]


              base = "-".join(
                  words[:5]
              )


              digest = hashlib.md5(
                  (
                      title
                      + category
                  ).encode(
                      "utf-8"
                  )
              ).hexdigest()[:8]


              return (
                  base
                  + "-"
                  + digest
                  + "-"
                  + date_file
              )


