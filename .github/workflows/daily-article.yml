          # =================================================
          # TEXT WRAPPING
          # =================================================

          def wrap_text(
              text,
              max_chars=34
          ):

              words = text.split()

              lines = []

              current = ""

              for word in words:

                  test = (
                      current +
                      " " +
                      word
                  ).strip()

                  if len(test) <= max_chars:

                      current = test

                  else:

                      if current:

                          lines.append(current)

                      current = word

              if current:

                  lines.append(current)

              return lines[:3]


