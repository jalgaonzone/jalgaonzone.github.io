      - name: Update Robots.txt
        run: |
          python <<'PY'
          import os

          robots_file = "robots.txt"
          sitemap_line = "Sitemap: https://jalgaonzone.github.io/sitemap.xml"

          if os.path.exists(robots_file):
              with open(robots_file, "r", encoding="utf-8") as file:
                  lines = file.read().splitlines()
          else:
              lines = ["User-agent: *", "Allow: /"]

          lines = [
              line for line in lines
              if not line.lower().startswith("sitemap:")
          ]

          lines.append(sitemap_line)

          with open(robots_file, "w", encoding="utf-8") as file:
              file.write("\n".join(lines) + "\n")

          print("robots.txt updated.")
          PY

      # ==========================================
      # VERIFY ARTICLES, METADATA AND SITEMAP
      # ==========================================

      - name: Verify Website Data
        run: |
          python <<'PY'
          import os
          import re
          import xml.etree.ElementTree as ET

          BASE_URL = "https://jalgaonzone.github.io"

          if not os.path.isdir("articles"):
              raise RuntimeError("articles directory missing")

          article_files = sorted(
              name for name in os.listdir("articles")
              if name.endswith(".md")
          )

          if not article_files:
              raise RuntimeError("No Markdown articles found")

          if not os.path.exists("articles-data.js"):
              raise RuntimeError("articles-data.js missing")

          with open("articles-data.js", "r", encoding="utf-8") as file:
              content = file.read()

          ids = re.findall(
              r'\bid\s*:\s*["\']([^"\']+)["\']',
              content
          )

          ids += re.findall(
              r'"id"\s*:\s*"([^"]+)"',
              content
          )

          duplicate_ids = sorted({
              article_id for article_id in ids
              if ids.count(article_id) > 1
          })

          if duplicate_ids:
              raise RuntimeError(
                  "Duplicate metadata IDs: "
                  + ", ".join(duplicate_ids[:20])
              )

          metadata_ids = set(ids)

          missing_metadata = [
              filename[:-3]
              for filename in article_files
              if filename[:-3] not in metadata_ids
          ]

          if missing_metadata:
              raise RuntimeError(
                  "Articles missing from metadata: "
                  + ", ".join(missing_metadata[:20])
              )

          for filename in article_files:
              filepath = os.path.join("articles", filename)

              with open(filepath, "r", encoding="utf-8") as file:
                  article_text = file.read()

              if not article_text.strip():
                  raise RuntimeError("Empty article: " + filename)

              if not re.search(r"(?m)^#\s+.+", article_text):
                  raise RuntimeError("Article title missing: " + filename)

          tree = ET.parse("sitemap.xml")
          root = tree.getroot()

          sitemap_urls = {
              element.text.strip()
              for element in root.iter()
              if element.tag.endswith("loc") and element.text
          }

          expected_main_pages = [
              "/",
              "/news.html",
              "/agriculture.html",
              "/history.html",
              "/places.html",
              "/blogs.html",
              "/about.html",
              "/education-jobs.html",
              "/government-schemes.html",
              "/jalgaon-information.html"
          ]

          missing_pages = [
              BASE_URL + page
              for page in expected_main_pages
              if BASE_URL + page not in sitemap_urls
          ]

          if missing_pages:
              raise RuntimeError(
                  "Main pages missing from sitemap: "
                  + ", ".join(missing_pages)
              )

          missing_articles = []

          for filename in article_files:
              expected = (
                  BASE_URL
                  + "/article.html?id="
                  + filename[:-3]
              )

              if expected not in sitemap_urls:
                  missing_articles.append(expected)

          if missing_articles:
              raise RuntimeError(
                  "Articles missing from sitemap: "
                  + ", ".join(missing_articles[:20])
              )

          if not os.path.exists("robots.txt"):
              raise RuntimeError("robots.txt missing")

          with open("robots.txt", "r", encoding="utf-8") as file:
              robots = file.read()

          if BASE_URL + "/sitemap.xml" not in robots:
              raise RuntimeError("Sitemap URL missing from robots.txt")

          print("Article files:", len(article_files))
          print("Metadata IDs:", len(metadata_ids))
          print("Sitemap URLs:", len(sitemap_urls))
          print("Category pages: OK")
          print("robots.txt: OK")
          print("ALL WEBSITE CHECKS PASSED")
          PY

