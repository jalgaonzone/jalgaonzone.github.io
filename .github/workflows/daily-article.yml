              "===================================="
          )

          print(
              "VERIFYING WEBSITE DATA"
          )

          print(
              "===================================="
          )


          # =====================================================
          # ARTICLES DIRECTORY
          # =====================================================

          if not os.path.isdir(
              "articles"
          ):

              raise Exception(
                  "articles directory missing"
              )


          article_files = [

              filename

              for filename in os.listdir(
                  "articles"
              )

              if filename.endswith(".md")
          ]


          print(
              "Article files:",
              len(article_files)
          )


          if len(article_files) == 0:

              raise Exception(
                  "No article files found"
              )


          # =====================================================
          # ARTICLES DATA
          # =====================================================

          if not os.path.exists(
              "articles-data.js"
          ):

              raise Exception(
                  "articles-data.js missing"
              )


          with open(
              "articles-data.js",
              "r",
              encoding="utf-8"
          ) as f:

              articles_js = f.read()


          if "[" not in articles_js:

              raise Exception(
                  "articles-data.js array missing"
              )


          if "]" not in articles_js:

              raise Exception(
                  "articles-data.js closing bracket missing"
              )


          ids = re.findall(
              r'"id"\s*:\s*"([^"]+)"',
              articles_js
          )


          print(
              "Article metadata IDs:",
              len(ids)
          )


          # =====================================================
          # DUPLICATE IDS
          # =====================================================

          duplicate_ids = sorted(
              {
                  article_id
                  for article_id in ids
                  if ids.count(article_id) > 1
              }
          )


          if duplicate_ids:

              raise Exception(
                  "Duplicate article IDs found: "
                  + ", ".join(
                      duplicate_ids
                  )
              )


          # =====================================================
          # SITEMAP
          # =====================================================

          if not os.path.exists(
              "sitemap.xml"
          ):

              raise Exception(
                  "sitemap.xml missing"
              )


          try:

              tree = ET.parse(
                  "sitemap.xml"
              )

              root = tree.getroot()

              sitemap_locations = [

                  element.text

                  for element in root.iter()

                  if element.tag.endswith(
                      "loc"
                  )
                  and element.text
              ]

          except Exception as error:

              raise Exception(
                  "Sitemap validation failed: "
                  + str(error)
              )


          print(
              "Sitemap URLs:",
              len(sitemap_locations)
          )


          # =====================================================
          # CHECK EVERY ARTICLE IS IN SITEMAP
          # =====================================================

          missing_from_sitemap = []


          for filename in article_files:

              article_id = filename[:-3]

              expected_url = (
                  "https://jalgaonzone.github.io/"
                  "article.html?id="
                  + article_id
              )


              if expected_url not in sitemap_locations:

                  missing_from_sitemap.append(
                      article_id
                  )


          if missing_from_sitemap:

              raise Exception(
                  "Articles missing from sitemap: "
                  + ", ".join(
                      missing_from_sitemap[:20]
                  )
              )


          # =====================================================
          # ROBOTS
          # =====================================================

          if not os.path.exists(
              "robots.txt"
          ):

              raise Exception(
                  "robots.txt missing"
              )


          with open(
              "robots.txt",
              "r",
              encoding="utf-8"
          ) as f:

              robots_content = f.read()


          if (
              "https://jalgaonzone.github.io/sitemap.xml"
              not in robots_content
          ):

              raise Exception(
                  "Sitemap URL missing from robots.txt"
              )


          print(
              "robots.txt: OK"
          )


          print("")
          print(
              "===================================="
          )

          print(
              "ALL WEBSITE CHECKS PASSED"
          )

          print(
              "===================================="
          )


          PY


      # =====================================================
      # GIT DIFF CHECK
      # =====================================================

      - name: Check Git Diff
        run: |
          git diff --check


      # =====================================================
      # COMMIT AND PUSH
      # =====================================================

      - name: Commit and Push
        run: |

          git config user.name "Jalgaon Zone Bot"

          git config user.email "actions@github.com"


          git add \
            articles/ \
            Images/ \
            articles-data.js \
            sitemap.xml \
            robots.txt


          if git diff --cached --quiet; then

              echo "No changes to commit."

              exit 0

          fi


          git commit \
            -m "Daily Jalgaon Zone articles, sitemap and SEO update"


          git push
