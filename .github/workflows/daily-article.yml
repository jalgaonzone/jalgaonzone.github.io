                      start
                      + offset
                  ) % len(available)

                  title, angle = available[index]


                  if not already_used(title):

                      found = (
                          title,
                          angle,
                          index
                      )

                      break


              if found is None:

                  print(
                      "No unused topic:",
                      category
                  )

                  continue


              selected.append(
                  (
                      category,
                      found[0],
                      found[1],
                      found[2]
                  )
              )


