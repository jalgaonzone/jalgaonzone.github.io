          if new_entries:
              existing_array_content = array_text[1:-1].strip()
              additions = ",\n".join(new_entries)

              if existing_array_content:
                  combined = existing_array_content + ",\n" + additions
              else:
                  combined = additions

              new_array = "[\n" + combined + "\n]"
              new_content = (
                  old_content[:start]
                  + new_array
                  + old_content[end + 1:]
              )

              with open(data_file, "w", encoding="utf-8") as file:
                  file.write(new_content)

              print("articles-data.js updated.")
          else:
              print("No new metadata entries.")

          print("Generated articles:", len(new_articles))
          PY

      # ==========================================
      # UPDATE SITEMAP
      # ==========================================

      - name: Update Sitemap
        run: |
          python <<'PY'
          import os
          import html
          import xml.etree.ElementTree as ET

          BASE_URL = "https://jalgaonzone.github.io"
          SITEMAP_FILE = "sitemap.xml"

          # Preserve all website pages, including the new categories.
          main_pages = [
              "/",
              "/news.html",
              "/agriculture.html",
              "/history.html",
              "/places.html",
              "/blogs.html",
              "/about.html",
              "/education-jobs.html",
              "/government-schemes.html",
              "/jalgaon-information.html"
          ]

          # Retain any previous sitemap URLs that are not article URLs.
          # This protects additional pages already added manually.
          previous_urls = []

          if os.path.exists(SITEMAP_FILE):
              try:
                  previous_tree = ET.parse(SITEMAP_FILE)
                  previous_root = previous_tree.getroot()

                  for element in previous_root.iter():
                      if not element.tag.endswith("loc") or not element.text:
                          continue

                      old_url = element.text.strip()

                      if not old_url.startswith(BASE_URL):
                          continue

                      path = old_url[len(BASE_URL):]

                      if path.startswith("/article.html?id="):
                          continue

                      if path and path not in previous_urls:
                          previous_urls.append(path)

              except ET.ParseError:
                  print("Previous sitemap invalid; rebuilding known pages.")

          article_urls = []

          for filename in os.listdir("articles"):
              if filename.endswith(".md"):
                  article_id = filename[:-3]
                  article_urls.append("/article.html?id=" + article_id)

          article_urls.sort()

          all_urls = list(
              dict.fromkeys(main_pages + previous_urls + article_urls)
          )

          namespace = "http://www.sitemaps.org/schemas/sitemap/0.9"
          ET.register_namespace("", namespace)

          root = ET.Element("{" + namespace + "}urlset")

          for url in all_urls:
              element = ET.SubElement(root, "{" + namespace + "}url")
              loc = ET.SubElement(element, "{" + namespace + "}loc")
              loc.text = BASE_URL + url

          tree = ET.ElementTree(root)
          tree.write(
              SITEMAP_FILE,
              encoding="utf-8",
              xml_declaration=True
          )

          ET.parse(SITEMAP_FILE)

          print("Sitemap updated.")
          print("Main pages:", len(main_pages))
          print("Article URLs:", len(article_urls))
          print("Total URLs:", len(all_urls))
          PY

      # ==========================================
