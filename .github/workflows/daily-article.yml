          all_existing_text = ""

          for root, dirs, files in os.walk("articles"):

              for filename in files:

                  if not filename.endswith(".md"):
                      continue

                  path = os.path.join(
                      root,
                      filename
                  )

                  try:

                      with open(
                          path,
                          "r",
                          encoding="utf-8"
                      ) as f:

                          all_existing_text += (
                              f.read().lower()
                              + "\n"
                          )

                  except Exception as error:

                      print(
                          "Could not read:",
                          path,
                          error
                      )


          # =====================================================
          # NORMALIZE
          # =====================================================

          def normalize(text):

              text = text.lower()

              text = re.sub(
                  r"[^a-z0-9\u0900-\u097f]+",
                  " ",
                  text
              )

              return " ".join(
                  text.split()
              )


          normalized_existing = normalize(
              all_existing_text
          )


          # =====================================================
          # DUPLICATE CHECK
          # =====================================================

          def already_used(title):

              return (
                  normalize(title)
                  in normalized_existing
              )


          # =====================================================
          # SLUG
          # =====================================================

          def make_slug(text):

              transliteration = {

                  "जळगाव": "jalgaon",
                  "जिल्हा": "district",
                  "शेती": "farming",
                  "शिक्षण": "education",
                  "रोजगार": "jobs",
                  "सरकारी": "government",
                  "योजना": "schemes",
                  "पर्यटन": "tourism",
                  "इतिहास": "history",
                  "माहिती": "information",
                  "विद्यार्थी": "students",
                  "शेतकरी": "farmers",
                  "पाणी": "water",
                  "कृषी": "agriculture",
                  "किल्ला": "fort",
                  "संस्कृती": "culture",
                  "वाहतूक": "transport",
                  "बाजारपेठ": "market",
                  "करिअर": "career",
                  "कौशल्य": "skills",
                  "नागरिक": "citizens",
                  "अभ्यास": "study",
                  "शहर": "city",
                  "गाव": "village",
                  "व्यवसाय": "business",
                  "हवामान": "weather",
                  "केळी": "banana",
                  "सिंचन": "irrigation",
                  "कापूस": "cotton",
                  "मका": "maize",
                  "किल्ले": "forts",
                  "शिष्यवृत्ती": "scholarship"
              }


              result = text


              for marathi, english in transliteration.items():

                  result = result.replace(
                      marathi,
                      " " + english + " "
                  )


              result = re.sub(
                  r"[^a-zA-Z0-9]+",
                  "-",
                  result
              )


              result = result.strip(
                  "-"
              ).lower()


              short_hash = hashlib.md5(
                  text.encode("utf-8")
              ).hexdigest()[:8]


              return (
                  result[:75]
                  + "-"
                  + short_hash
              )


