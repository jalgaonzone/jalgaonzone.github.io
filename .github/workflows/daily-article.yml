                  + "\"\n"
                  + "date: \""
                  + date_text
                  + "\"\n"
                  + "image: \""
                  + image_file
                  + "\"\n"
                  + "description: \""
                  + description.replace(
                      '"',
                      '\\"'
                  )
                  + "\"\n"
                  + "---\n\n"
              )


              final_content = (
                  front_matter
                  + "# "
                  + title
                  + "\n\n"
                  + content
                  + "\n"
              )


              article_path = os.path.join(
                  "articles",
                  article_file
              )


              with open(
                  article_path,
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(
                      final_content
                  )


              new_articles.append(
                  metadata
              )


              word_count = len(
                  re.findall(
                      r"\S+",
                      content
                  )
              )


              print(
                  "Generated:",
                  article_path
              )

              print(
                  "Words:",
                  word_count
              )


          # =====================================================
          # UPDATE ARTICLES-DATA.JS
          # =====================================================

          if new_articles:

              all_data = []

              all_data.extend(
                  existing_data
              )


              existing_ids_final = set()

              for item in all_data:

                  if not isinstance(
                      item,
                      dict
                  ):

                      continue


                  item_id = str(
                      item.get(
                          "id",
                          ""
                      )
                  ).strip()


                  if item_id:

                      existing_ids_final.add(
                          item_id
                      )


              for item in new_articles:

                  if item["id"] in existing_ids_final:

                      print(
                          "Skipping duplicate metadata:",
                          item["id"]
                      )

                      continue


                  all_data.append(
                      item
                  )

                  existing_ids_final.add(
                      item["id"]
                  )


              # =================================================
              # PERMANENT FIX:
              # WRITE PURE JSON-STYLE OBJECTS
              # INSIDE JAVASCRIPT ARRAY
              # =================================================

              with open(
                  "articles-data.js",
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(
                      "const articles = "
                  )

                  json.dump(
                      all_data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

                  f.write(
                      ";\n"
                  )


              print(
                  "articles-data.js updated successfully."
              )

              print(
                  "Total metadata articles:",
                  len(all_data)
              )


          else:

              print(
                  "No new articles generated."
