              )


              if os.path.exists(article_file):

                  print(
                      "Already exists:",
                      article_file
                  )

                  continue


              # =================================================
              # ARTICLE
              # =================================================

              body = create_article(
                  category,
                  title,
                  angle,
                  topic_index
              )


              word_count = len(
                  body.split()
              )


              print("")
              print(
                  f"{category} -> {title}"
              )

              print(
                  "Word count:",
                  word_count
              )


              if word_count < 1000:

                  raise Exception(
                      "ARTICLE LENGTH ERROR"
                  )


              # =================================================
              # IMAGE
              # =================================================

              color1, color2 = colors[
                  i % len(colors)
              ]


              def wrap_text(
                  text,
                  max_chars=32
              ):

                  words = text.split()

                  lines = []

                  current = ""


                  for word in words:

                      test = (
                          current
                          + " "
                          + word
                      ).strip()


                      if len(test) <= max_chars:

                          current = test

                      else:

                          if current:

                              lines.append(
                                  current
                              )

                          current = word


                  if current:

                      lines.append(
                          current
                      )


                  return lines[:3]


              title_lines = wrap_text(
                  title
              )


              title_svg = ""

              y = 285


              for line in title_lines:

                  title_svg += f"""
          <text
              x="70"
              y="{y}"
              font-size="48"
              font-weight="700"
              fill="white"
              font-family="Noto Sans Devanagari, Devanagari, Arial, sans-serif">
              {html.escape(line)}
          </text>
          """

                  y += 65


              svg = f"""<?xml version="1.0" encoding="UTF-8"?>

          <svg
              xmlns="http://www.w3.org/2000/svg"
              width="1200"
              height="630"
              viewBox="0 0 1200 630">

