                      id="bg"
                      x1="0%"
                      y1="0%"
                      x2="100%"
                      y2="100%">

                      <stop
                          offset="0%"
                          stop-color="{color1}"/>

                      <stop
                          offset="100%"
                          stop-color="{color2}"/>

                  </linearGradient>

              </defs>

              <rect
                  width="1200"
                  height="630"
                  fill="url(#bg)"/>

              <circle
                  cx="1050"
                  cy="90"
                  r="180"
                  fill="white"
                  opacity="0.08"/>

              <circle
                  cx="1100"
                  cy="560"
                  r="230"
                  fill="white"
                  opacity="0.06"/>

              <text
                  x="70"
                  y="85"
                  font-size="30"
                  font-weight="600"
                  fill="white"
                  font-family="Arial, sans-serif">
                  JALGAON ZONE
              </text>

              <rect
                  x="70"
                  y="125"
                  width="400"
                  height="52"
                  rx="26"
                  fill="white"
                  opacity="0.18"/>

              <text
                  x="95"
                  y="160"
                  font-size="24"
                  fill="white"
                  font-family="Noto Sans Devanagari, Devanagari, Arial, sans-serif">
                  {html.escape(category)}
              </text>

              {title_svg}

              <text
                  x="70"
                  y="560"
                  font-size="24"
                  fill="white"
                  opacity="0.9"
                  font-family="Arial, sans-serif">
                  {date_text}
              </text>

              <text
                  x="1130"
                  y="570"
                  text-anchor="end"
                  font-size="22"
                  fill="white"
                  opacity="0.8"
                  font-family="Arial, sans-serif">
                  Jalgaon • Maharashtra
              </text>

          </svg>
          """


              with open(
                  image_file,
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(svg)


              with open(
                  article_file,
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(body)


              # =================================================
              # METADATA
              # =================================================

              article_id = filename_base


              metadata = {

                  "id": article_id,

                  "title": title,

                  "category": category,

                  "date": date_text,

                  "image": image_file,

                  "description": (
                      title
                      + " — Jalgaon Zone वरील "
                      + "सविस्तर माहिती."
                  ),

                  "file": article_file,

                  "link": (
                      "article.html?id="
                      + article_id
                  )
              }


              new_articles.append(
                  metadata
              )


              print(
                  "Created:",
                  article_file
              )

              print(
                  "Created:",
                  image_file
              )


          # =====================================================
          # UPDATE ARTICLES-DATA.JS
          # =====================================================

          if new_articles:

              data_file = "articles-data.js"


              if os.path.exists(data_file):

                  with open(
                      data_file,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      old_content = f.read()

              else:

                  old_content = (
                      "const articles = [];"
                  )


              start = old_content.find("[")
              end = old_content.rfind("]")


              if (
                  start == -1
                  or end == -1
                  or end <= start
              ):

                  raise Exception(
                      "articles-data.js must contain an array"
                  )


              existing_array_content = (
                  old_content[
                      start + 1:end
                  ].strip()
              )


              new_entries = []


              for item in new_articles:

                  json_item = json.dumps(
                      item,
                      ensure_ascii=False,
                      indent=2
                  )

                  new_entries.append(
                      "  "
                      + json_item
                  )


              additions = ",\n".join(
                  new_entries
              )


              if existing_array_content:

                  combined = (
                      existing_array_content
                      + ",\n"
                      + additions
                  )

              else:

                  combined = additions


              new_content = (
                  old_content[:start + 1]
                  + "\n"
                  + combined
                  + "\n"
                  + old_content[end:]
              )


              with open(
                  data_file,
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(new_content)


              print(
                  "Updated:",
                  data_file
              )


          # =====================================================
          # REPORT
          # =====================================================

          print("")
          print("====================================")
          print("JALGAON ZONE DAILY AUTOMATION")
          print("====================================")

