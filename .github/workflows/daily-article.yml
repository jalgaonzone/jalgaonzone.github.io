          # ======================================
          # HELPERS
          # ======================================

          def normalize(value):
              value = value.lower()
              value = re.sub(
                  r"[^a-z0-9\u0900-\u097f]+",
                  " ",
                  value
              )
              return " ".join(value.split())

          def make_slug(title):
              replacements = {
                  "जळगाव": "jalgaon",
                  "जिल्हा": "district",
                  "माहिती": "information",
                  "इतिहास": "history",
                  "शेती": "agriculture",
                  "शेतकरी": "farmers",
                  "केळी": "banana",
                  "पर्यटन": "tourism",
                  "शिक्षण": "education",
                  "रोजगार": "jobs",
                  "सरकारी": "government",
                  "योजना": "scheme",
                  "हवामान": "weather",
                  "पाणी": "water",
                  "व्यवसाय": "business",
                  "विद्यार्थी": "students",
                  "कृषी": "agriculture"
              }

              slug = title.lower()

              for marathi, english in replacements.items():
                  slug = slug.replace(marathi, english)

              slug = re.sub(r"[^a-zA-Z0-9]+", "-", slug)
              slug = re.sub(r"-+", "-", slug).strip("-")
              digest = hashlib.md5(
                  title.encode("utf-8")
              ).hexdigest()[:8]

              return (slug[:90] or "jalgaon-article") + "-" + digest

          def escape_yaml(value):
              return json.dumps(value, ensure_ascii=False)

          # ======================================
          # READ EXISTING ARTICLE TITLES
          # ======================================

          existing_titles = set()
          existing_ids = set()

          for filename in os.listdir("articles"):
              if not filename.endswith(".md"):
                  continue

              filepath = os.path.join("articles", filename)
              existing_ids.add(filename[:-3])

              try:
                  with open(filepath, "r", encoding="utf-8") as file:
                      content = file.read()

                  match = re.search(
                      r"(?m)^#\s+(.+)$",
                      content
                  )

                  if match:
                      existing_titles.add(
                          normalize(match.group(1).strip())
                      )

              except OSError as error:
                  print("Read warning:", filepath, error)

          # ======================================
          # LOAD ARTICLE METADATA
          # ======================================

          def load_metadata():
              path = "articles-data.js"

              if not os.path.exists(path):
                  return []

              with open(path, "r", encoding="utf-8") as file:
                  content = file.read()

              start = content.find("[")
              end = content.rfind("]")

              if start < 0 or end <= start:
                  raise RuntimeError(
                      "Cannot locate articles array in articles-data.js"
                  )

              array_text = content[start:end + 1]

              # The existing file may contain JS object syntax.
              # Extract only known metadata fields.
              ids = re.findall(
                  r'\bid\s*:\s*["\']([^"\']+)["\']',
                  array_text
              )

              titles = re.findall(
                  r'\btitle\s*:\s*["\']([^"\']*)["\']',
                  array_text
              )

              result = []

              for index, article_id in enumerate(ids):
                  result.append({
                      "id": article_id,
                      "title": titles[index] if index < len(titles) else ""
                  })

              return result

          def get_related_links(category, current_id):
              metadata = load_metadata()
              matches = []

              for item in metadata:
                  article_id = item.get("id", "").strip()
                  title = item.get("title", "").strip()

                  if not article_id or not title or article_id == current_id:
                      continue

                  if article_id not in existing_ids:
                      continue

                  if article_id in {
                      match["id"] for match in matches
                  }:
                      continue

                  matches.append({
                      "id": article_id,
                      "title": title
                  })

                  if len(matches) >= 5:
                      break

              if not matches:
                  return ""

              result = "## Jalgaon Zone वरील संबंधित लेख\n\n"

              for item in matches:
                  result += (
                      "- ["
                      + item["title"].replace("[", "").replace("]", "")
                      + "]("
                      + "article.html?id="
                      + item["id"]
                      + ")\n"
                  )

              return result + "\n"

