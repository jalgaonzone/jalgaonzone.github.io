name: Daily Jalgaon Zone Articles

on:
  schedule:
    # Runs every day at 7:00 AM IST
    # GitHub Actions uses UTC, so 01:30 UTC = 07:00 AM IST
    - cron: "30 1 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  create-articles:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.x"


      # =====================================================
      # DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install pyyaml


      # =====================================================
      # GENERATE DAILY ARTICLES
      # =====================================================

      - name: Generate Daily Articles
        run: |

          python <<'PY'

