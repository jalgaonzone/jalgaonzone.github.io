        run: |

          echo "===================================="
          echo "ARTICLES"
          echo "===================================="

          ls -lah articles/ | tail -30

          echo ""

          echo "===================================="
          echo "IMAGES"
          echo "===================================="

          ls -lah Images/ | tail -30


      # =====================================================
      # CHECK CHANGES
      # =====================================================

      - name: Check changes
        run: |

          echo "===================================="
          echo "GIT STATUS"
          echo "===================================="

          git status --short


      # =====================================================
      # COMMIT AND PUSH
      # =====================================================

      - name: Commit and Push
        run: |

          git config user.name "Jalgaon Zone Bot"

          git config user.email "actions@github.com"

          git add \
            articles/ \
            Images/ \
            articles-data.js

          if git diff --cached --quiet; then

              echo "No changes to commit."

              exit 0

          fi

          git commit \
            -m "Daily Jalgaon Zone articles and images"

          git push

          echo ""
          echo "===================================="
          echo "SUCCESS"
          echo "===================================="
          echo "Articles generated and pushed successfully."
