      # =====================================================
      # VERIFY WEBSITE DATA
      # =====================================================

      - name: Verify Website Data
        run: |

          python <<'PY'

          import os
          import re
          import json
          import xml.etree.ElementTree as ET


          print(
              "===================================="
          )

          print(
              "VERIFYING WEBSITE DATA"
          )

          print(
              "===================================="
          )


          # =====================================================
          # ARTICLES DIRECTORY
          # =====================================================

          if not os.path.isdir(
              "articles"
          ):

              raise Exception(
                  "articles directory missing"
              )


          article_files = [

              filename

              for filename in os.listdir(
                  "articles"
              )

              if filename.endswith(
                  ".md"
              )
          ]


          print(
              "Article files:",
              len(article_files)
          )


          if not article_files:

              raise Exception(
                  "No article files found"
              )


          # =====================================================
          # ARTICLES-DATA.JS
          # =====================================================

          if not os.path.exists(
              "articles-data.js"
          ):

              raise Exception(
                  "articles-data.js missing"
              )


          with open(
              "articles-data.js",
              "r",
              encoding="utf-8"
          ) as f:

              articles_js = f.read()


          if not articles_js.startswith(
              "const articles = "
          ):

              raise Exception(
                  "articles-data.js has invalid format"
              )


          start = articles_js.find("[")

          end = articles_js.rfind("]")


          if (
              start == -1
              or end == -1
              or end <= start
          ):

              raise Exception(
                  "articles-data.js array missing"
              )


          array_text = articles_js[
              start:end + 1
          ]


          try:

              metadata = json.loads(
                  array_text
              )

          except Exception as error:

              raise Exception(
                  "articles-data.js JSON validation failed: "
                  + str(error)
              )


          if not isinstance(
              metadata,
              list
          ):

              raise Exception(
                  "articles-data.js data is not a list"
              )


          print(
              "Article metadata IDs:",
              len(metadata)
          )


          # =====================================================
          # DUPLICATE IDS
          # =====================================================

          ids = []


          for item in metadata:

              if not isinstance(
                  item,
                  dict
              ):

                  raise Exception(
                      "Invalid article metadata object"
                  )


              article_id = str(
                  item.get(
                      "id",
                      ""
                  )
              ).strip()


              if not article_id:

                  raise Exception(
                      "Article metadata contains empty ID"
                  )


              ids.append(
                  article_id
              )


          duplicate_ids = sorted(
              {
                  article_id

                  for article_id in ids

                  if ids.count(
                      article_id
                  ) > 1
              }
          )


          if duplicate_ids:

              raise Exception(
                  "Duplicate article IDs found: "
                  + ", ".join(
                      duplicate_ids
                  )
              )


          print(
              "Duplicate IDs: 0"
          )


          # =====================================================
          # SITEMAP
          # =====================================================

          if not os.path.exists(
              "sitemap.xml"
          ):

              raise Exception(
                  "sitemap.xml missing"
              )


          try:

              tree = ET.parse(
                  "sitemap.xml"
              )

              root = tree.getroot()


              sitemap_locations = [

                  element.text

                  for element in root.iter()

                  if element.tag.endswith(
                      "loc"
                  )

                  and element.text

              ]


          except Exception as error:

              raise Exception(
                  "Sitemap validation failed: "
                  + str(error)
              )


          print(
              "Sitemap URLs:",
              len(sitemap_locations)
          )


          # =====================================================
          # CHECK EVERY ARTICLE IS IN SITEMAP
          # =====================================================

          missing_from_sitemap = []


          for filename in article_files:

              article_id = filename[
                  :-3
              ]


              expected_url = (
                  "https://jalgaonzone.github.io/"
                  "article.html?id="
                  + article_id
              )


              if (
                  expected_url
                  not in sitemap_locations
              ):

                  missing_from_sitemap.append(
                      article_id
                  )


          if missing_from_sitemap:

              raise Exception(
                  "Articles missing from sitemap: "
                  + ", ".join(
                      missing_from_sitemap[:20]
                  )
              )


          print(
              "All article URLs found in sitemap."
          )


          # =====================================================
          # MAIN PAGES
          # =====================================================

          required_pages = [

              "https://jalgaonzone.github.io/",

              "https://jalgaonzone.github.io/news.html",

              "https://jalgaonzone.github.io/agriculture.html",

              "https://jalgaonzone.github.io/history.html",

              "https://jalgaonzone.github.io/places.html",

              "https://jalgaonzone.github.io/blogs.html",

              "https://jalgaonzone.github.io/about.html"
          ]


          missing_pages = [

              page

              for page in required_pages

              if page not in sitemap_locations
          ]


          if missing_pages:

              raise Exception(
                  "Main pages missing from sitemap: "
                  + ", ".join(
                      missing_pages
                  )
              )


          # =====================================================
          # ROBOTS
          # =====================================================

          if not os.path.exists(
              "robots.txt"
          ):

              raise Exception(
                  "robots.txt missing"
              )


          with open(
              "robots.txt",
              "r",
              encoding="utf-8"
          ) as f:

              robots_content = f.read()


          sitemap_url = (
              "https://jalgaonzone.github.io/sitemap.xml"
          )


          if sitemap_url not in robots_content:

              raise Exception(
                  "Sitemap URL missing from robots.txt"
              )


          print(
              "robots.txt: OK"
          )


          # =====================================================
          # FINAL
          # =====================================================

          print("")

          print(
              "===================================="
          )

          print(
              "ALL WEBSITE CHECKS PASSED"
          )

          print(
              "===================================="
          )


          PY


