              )


          with open(
              "articles-data.js",
              "r",
              encoding="utf-8"
          ) as f:

              final_js = f.read()


          if not final_js.startswith(
              "const articles = "
          ):

              raise Exception(
                  "articles-data.js format is invalid"
              )


          if not final_js.rstrip().endswith(
              ";"
          ):

              raise Exception(
                  "articles-data.js missing semicolon"
              )


          print("")
          print(
              "===================================="
          )

          print(
              "PART 1 COMPLETED"
          )

          print(
              "Articles generated:",
              len(new_articles)
          )

          print(
              "===================================="
          )


