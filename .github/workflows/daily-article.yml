name: Daily Jalgaon Zone Articles

on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 AM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:

  create-articles:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml


      # =====================================================
      # CREATE DIRECTORIES
      # =====================================================

      - name: Prepare Directories
        run: |
          mkdir -p articles
          mkdir -p Images


      # =====================================================
      # GENERATE ARTICLES
      #
      # IMPORTANT:
      # Keep your existing article-generation Python code
      # here if you already have the large topic engine.
      # =====================================================

      - name: Generate Daily Articles
        run: |

          python <<'PY'

          import os
          import re
          import yaml
          import html
          from datetime import datetime
          from zoneinfo import ZoneInfo


          # =================================================
          # DATE
          # =================================================

          tz = ZoneInfo("Asia/Kolkata")
          now = datetime.now(tz)

          date_text = now.strftime("%d %B %Y")
          date_slug = now.strftime("%Y-%m-%d")


          # =================================================
          # DIRECTORIES
          # =================================================

          os.makedirs("articles", exist_ok=True)
          os.makedirs("Images", exist_ok=True)


          # =================================================
          # TOPIC ENGINE
          # =================================================

          topic_file = "content/topic-engine.yml"

          topics = []

          if os.path.exists(topic_file):

              try:

                  with open(
                      topic_file,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      data = yaml.safe_load(f)

                  if isinstance(data, dict):

                      for key, value in data.items():

                          if isinstance(value, list):

                              for item in value:

                                  if isinstance(item, str):
                                      topics.append(
                                          (key, item)
                                      )

                                  elif isinstance(item, dict):

                                      title = (
                                          item.get("title")
                                          or item.get("topic")
                                          or item.get("name")
                                      )

                                      if title:
                                          topics.append(
                                              (key, title)
                                          )

                  elif isinstance(data, list):

                      for item in data:

                          if isinstance(item, str):
                              topics.append(
                                  ("Jalgaon Information", item)
                              )

                          elif isinstance(item, dict):

                              title = (
                                  item.get("title")
                                  or item.get("topic")
                                  or item.get("name")
                              )

                              category = (
                                  item.get("category")
                                  or "Jalgaon Information"
                              )

                              if title:
                                  topics.append(
                                      (category, title)
                                  )

              except Exception as e:

                  print(
                      "Topic engine could not be loaded:",
                      e
                  )


          # =================================================
          # FALLBACK TOPICS
          # =================================================

          if not topics:

              topics = [

                  (
                      "Agriculture",
                      "जळगाव जिल्ह्यातील शेती आणि शेतकऱ्यांसाठी महत्त्वाची माहिती"
                  ),

                  (
                      "Education & Jobs",
                      "जळगावमधील शिक्षण आणि रोजगाराच्या संधी"
                  ),

                  (
                      "Government Schemes",
                      "जळगाव जिल्ह्यातील नागरिकांसाठी सरकारी योजनांची माहिती"
                  ),

                  (
                      "History & Tourism",
                      "जळगाव जिल्ह्याचा इतिहास आणि पर्यटनस्थळे"
                  ),

                  (
                      "Jalgaon Information",
                      "जळगाव जिल्ह्याची महत्त्वाची माहिती"
                  )

              ]


          # =================================================
          # EXISTING ARTICLES
          # =================================================

          existing_files = set(
              os.listdir("articles")
          )


          # =================================================
          # GENERATE UP TO 5 ARTICLES
          # =================================================

          generated = 0

          for category, topic in topics:

              if generated >= 5:
                  break

              safe_topic = re.sub(
                  r"[^a-zA-Z0-9\u0900-\u097F]+",
                  "-",
                  topic.lower()
              ).strip("-")

              if not safe_topic:
                  safe_topic = "jalgaon-information"

              article_id = (
                  safe_topic
                  + "-"
                  + date_slug
              )

              article_file = (
                  article_id
                  + ".md"
              )

              article_path = os.path.join(
                  "articles",
                  article_file
              )

              if article_file in existing_files:
                  continue


              # =============================================
              # TITLE
              # =============================================

              title = topic


              # =============================================
              # ARTICLE CONTENT
              # =============================================

              paragraphs = [

                  f"# {title}",

                  f"**दिनांक:** {date_text}",

                  f"**वर्ग:** {category}",

                  (
                      f"जळगाव जिल्ह्यातील {topic} या विषयाबद्दल "
                      "नागरिक, विद्यार्थी, शेतकरी आणि स्थानिक "
                      "वाचकांसाठी उपयुक्त माहिती जाणून घेणे "
                      "महत्त्वाचे आहे."
                  ),

                  (
                      f"जळगाव आणि खानदेश परिसराच्या दृष्टीने "
                      f"{topic} हा विषय स्थानिक पातळीवर "
                      "महत्त्वाचा आहे. या लेखामध्ये या विषयाशी "
                      "संबंधित प्राथमिक माहिती, महत्त्वाचे मुद्दे "
                      "आणि नागरिकांना उपयोगी ठरणाऱ्या बाबी "
                      "सोप्या भाषेत दिल्या आहेत."
                  ),

                  (
                      "जळगाव जिल्हा हा महाराष्ट्रातील महत्त्वाचा "
                      "जिल्हा असून शेती, शिक्षण, रोजगार, पर्यटन "
                      "आणि स्थानिक व्यवसाय यामुळे त्याचे वेगळे "
                      "महत्त्व आहे."
                  ),

                  (
                      f"{topic} संदर्भात माहिती घेताना "
                      "अधिकृत सरकारी संकेतस्थळे, स्थानिक प्रशासन "
                      "आणि संबंधित विभागाच्या अधिकृत सूचना "
                      "तपासणे आवश्यक आहे."
                  ),

                  (
                      "स्थानिक नागरिकांनी कोणतीही योजना, अर्ज, "
                      "अनुदान किंवा सरकारी सुविधा वापरण्यापूर्वी "
                      "अधिकृत माहितीची खात्री करावी."
                  ),

                  (
                      "जळगाव जिल्ह्यातील बदलत्या परिस्थितीनुसार "
                      "नवीन माहिती वेळोवेळी उपलब्ध होत असते. "
                      "त्यामुळे ताज्या माहितीसाठी संबंधित "
                      "विभागाच्या अधिकृत घोषणांकडे लक्ष देणे "
                      "उपयुक्त ठरते."
                  ),

                  (
                      "या विषयाबाबत तुमच्याकडे स्थानिक माहिती, "
                      "फोटो किंवा बातमी असल्यास Jalgaon Zone "
                      "च्या माध्यमातून ती अधिक लोकांपर्यंत "
                      "पोहोचवता येऊ शकते."
                  ),

                  (
                      "Jalgaon Zone वर जळगाव जिल्ह्यातील बातम्या, "
                      "शेती, शिक्षण, सरकारी योजना, इतिहास, "
                      "पर्यटन आणि स्थानिक माहिती याबाबत नियमित "
                      "लेख प्रकाशित केले जातात."
                  )

              ]


              # =============================================
              # MARKDOWN
              # =============================================

              content = "\n\n".join(
                  paragraphs
              )


              with open(
                  article_path,
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(content)


              # =============================================
              # IMAGE
              # =============================================

              image_name = (
                  article_id
                  + ".svg"
              )

              image_path = os.path.join(
                  "Images",
                  image_name
              )

              svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
              width="1200"
              height="630"
              viewBox="0 0 1200 630">

              <rect width="1200" height="630"
                    fill="#0d47a1"/>

              <text x="600"
                    y="280"
                    text-anchor="middle"
                    font-size="48"
                    fill="white"
                    font-family="Arial">

              Jalgaon Zone

              </text>

              <text x="600"
                    y="350"
                    text-anchor="middle"
                    font-size="32"
                    fill="white"
                    font-family="Arial">

              Jalgaon Maharashtra

              </text>

              </svg>'''


              with open(
                  image_path,
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(svg)


              # =============================================
              # ARTICLES DATA
              # =============================================

              metadata = {

                  "id": article_id,

                  "title": title,

                  "category": category,

                  "date": date_text,

                  "image": image_name,

                  "description":
                      title
                      + " — Jalgaon Zone वरील सविस्तर माहिती.",

                  "file": article_file,

                  "link":
                      "article.html?id="
                      + article_id

              }


              # =============================================
              # UPDATE articles-data.js
              # =============================================

              data_file = "articles-data.js"

              if not os.path.exists(data_file):

                  with open(
                      data_file,
                      "w",
                      encoding="utf-8"
                  ) as f:

                      f.write(
                          "const articles = [\n"
                          "];\n"
                      )


              with open(
                  data_file,
                  "r",
                  encoding="utf-8"
              ) as f:

                  js = f.read()


              object_text = (
                  "    "
                  + str(metadata)
                  .replace("'", '"')
                  + ",\n"
              )


              if article_id not in js:

                  position = js.rfind("];")

                  if position != -1:

                      js = (
                          js[:position]
                          + object_text
                          + js[position:]
                      )

                      with open(
                          data_file,
                          "w",
                          encoding="utf-8"
                      ) as f:

                          f.write(js)


              generated += 1

              print(
                  "Generated:",
                  article_id
              )


          print(
              "===================================="
          )

          print(
              "Articles generated:",
              generated
          )

          print(
              "===================================="

          )

          PY


      # =====================================================
      # AUTOMATIC SITEMAP
      # =====================================================

      - name: Update Sitemap
        run: |

          python <<'PY'

          import os
          import html


          BASE_URL = "https://jalgaonzone.github.io"

          SITEMAP_FILE = "sitemap.xml"


          # =================================================
          # MAIN PAGES
          # =================================================

          urls = [

              "/",

              "/news.html",

              "/agriculture.html",

              "/history.html",

              "/places.html",

              "/blogs.html",

              "/about.html"

          ]


          # =================================================
          # ALL ARTICLES
          # =================================================

          article_urls = []


          if os.path.exists("articles"):

              for filename in os.listdir("articles"):

                  if not filename.endswith(".md"):
                      continue

                  article_id = filename[:-3]

                  article_urls.append(
                      "/article.html?id="
                      + article_id
                  )


          # =================================================
          # SORT ARTICLES
          # =================================================

          article_urls.sort()


          # =================================================
          # REMOVE DUPLICATES
          # =================================================

          all_urls = list(
              dict.fromkeys(
                  urls + article_urls
              )
          )


          # =================================================
          # CREATE SITEMAP
          # =================================================

          with open(
              SITEMAP_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  '<?xml version="1.0" encoding="UTF-8"?>\n'
              )

              f.write(
                  '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
              )


              for url in all_urls:

                  full_url = (
                      BASE_URL
                      + url
                  )

                  f.write(
                      "    <url>\n"
                  )

                  f.write(
                      "        <loc>"
                      + html.escape(full_url)
                      + "</loc>\n"
                  )

                  f.write(
                      "    </url>\n"
                  )


              f.write(
                  "</urlset>\n"
              )


          print(
              "===================================="
          )

          print(
              "SITEMAP UPDATED"
          )

          print(
              "Main pages:",
              len(urls)
          )

          print(
              "Articles:",
              len(article_urls)
          )

          print(
              "Total URLs:",
              len(all_urls)
          )

          print(
              "===================================="

          )

          PY


      # =====================================================
      # SHOW RESULT
      # =====================================================

      - name: Show Generated Files
        run: |

          echo "===================================="
          echo "ARTICLES"
          echo "===================================="

          find articles -type f | sort


          echo ""
          echo "===================================="
          echo "IMAGES"
          echo "===================================="

          find Images -type f | sort


          echo ""
          echo "===================================="
          echo "SITEMAP"
          echo "===================================="

          cat sitemap.xml


      # =====================================================
      # CHECK CHANGES
      # =====================================================

      - name: Check Changes
        run: |

          git status

          git diff --stat


      # =====================================================
      # COMMIT & PUSH
      # =====================================================

      - name: Commit and Push
        run: |

          git config user.name "Jalgaon Zone Bot"

          git config user.email "actions@github.com"


          git add \
            articles/ \
            Images/ \
            articles-data.js \
            sitemap.xml


          if git diff --cached --quiet; then

              echo "No changes to commit."

              exit 0

          fi


          git commit \
            -m "Daily Jalgaon Zone articles, images and sitemap"


          git push
