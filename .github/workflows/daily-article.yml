          python <<'PY'

          import os
          import html
          import xml.etree.ElementTree as ET


          BASE_URL = "https://jalgaonzone.github.io"

          sitemap_file = "sitemap.xml"


          # =====================================================
          # MAIN WEBSITE PAGES
          # =====================================================

          main_pages = [

              "/",

              "/index.html",

              "/news.html",

              "/agriculture.html",

              "/history.html",

              "/places.html",

              "/blogs.html",

              "/about.html"
          ]


          # =====================================================
          # ARTICLE URLS
          # =====================================================

          article_urls = []


          if os.path.isdir("articles"):

              for filename in os.listdir("articles"):

                  if not filename.endswith(".md"):

                      continue


                  article_id = filename[:-3].strip()


                  if not article_id:

                      continue


                  article_urls.append(
                      "/article.html?id="
                      + article_id
                  )


          article_urls.sort()


          # =====================================================
          # REMOVE DUPLICATES
          # =====================================================

          all_urls = list(
              dict.fromkeys(
                  main_pages
                  + article_urls
              )
          )


          # =====================================================
          # WRITE SITEMAP
          # =====================================================

          with open(
              sitemap_file,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  '<?xml version="1.0" encoding="UTF-8"?>\n'
              )

              f.write(
                  '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
              )


              for url in all_urls:

                  full_url = (
                      BASE_URL
                      + url
                  )


                  f.write(
                      "    <url>\n"
                  )

                  f.write(
                      "        <loc>"
                      + html.escape(
                          full_url
                      )
                      + "</loc>\n"
                  )

                  f.write(
                      "    </url>\n"
                  )


              f.write(
                  "</urlset>\n"
              )


          # =====================================================
          # VALIDATE XML
          # =====================================================

          try:

              ET.parse(
                  sitemap_file
              )

              print(
                  "Sitemap XML validation: OK"
              )

          except Exception as error:

              raise Exception(
                  "Invalid sitemap.xml: "
                  + str(error)
              )


          # =====================================================
          # VALIDATE FILE
          # =====================================================

          if not os.path.exists(
              sitemap_file
          ):

              raise Exception(
                  "sitemap.xml was not created"
              )


          if os.path.getsize(
              sitemap_file
          ) < 100:

              raise Exception(
                  "sitemap.xml looks empty"
              )


          # =====================================================
          # CHECK ARTICLE COUNT
          # =====================================================

          expected_article_count = 0

          if os.path.isdir("articles"):

              expected_article_count = len(
                  [
                      f
                      for f in os.listdir("articles")
                      if f.endswith(".md")
                  ]
              )


          if len(article_urls) != expected_article_count:

              raise Exception(
                  "Sitemap article count mismatch."
              )


          print("")
          print("====================================")
          print("SITEMAP UPDATED")
          print("====================================")
          print(
              "Main pages:",
              len(main_pages)
          )
          print(
              "Articles:",
              len(article_urls)
          )
          print(
              "Total URLs:",
              len(all_urls)
          )
          print(
              "File size:",
              os.path.getsize(
                  sitemap_file
              ),
              "bytes"
          )
          print("====================================")


