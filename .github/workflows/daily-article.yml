                          "### या माहितीची खात्री कशी करावी?",
                          "महत्त्वाच्या माहितीसाठी अधिकृत सरकारी किंवा स्थानिक संस्थांचे स्रोत तपासावेत."
                      ),

                      (
                          "### Jalgaon Zone वर आणखी माहिती मिळेल का?",
                          "होय. Jalgaon Zone वर जळगाव जिल्ह्याशी संबंधित विविध विषयांवर नियमित माहिती प्रकाशित केली जाते."
                      )
                  ]


              output = "## वारंवार विचारले जाणारे प्रश्न\n\n"

              for question, answer in faq:

                  output += question + "\n\n"

                  output += answer + "\n\n"

              return output


          # =====================================================
          # DYNAMIC INTERNAL LINKS
          # =====================================================

          def load_articles_data():

              data_file = "articles-data.js"

              if not os.path.exists(data_file):

                  return []

              try:

                  with open(
                      data_file,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      content = f.read()

                  start = content.find("[")

                  end = content.rfind("]")

                  if (
                      start == -1
                      or end == -1
                      or end <= start
                  ):

                      return []

                  array_text = content[
                      start:end + 1
                  ]

                  data = json.loads(
                      array_text
                  )

                  if isinstance(data, list):

                      return data

              except Exception as error:

                  print(
                      "Could not load articles-data.js:",
                      error
                  )

              return []


          def internal_links():

              articles_data = load_articles_data()

              if not articles_data:

                  return ""

              links = []

              seen = set()

              for item in articles_data:

                  if not isinstance(
                      item,
                      dict
                  ):

                      continue

                  article_id = str(
                      item.get("id", "")
                  ).strip()

                  title = str(
                      item.get("title", "")
                  ).strip()

                  if (
                      not article_id
                      or not title
                      or article_id in seen
                  ):

                      continue

                  seen.add(article_id)

                  links.append(
                      "- ["
                      + title
                      + "](article.html?id="
                      + article_id
                      + ")"
                  )

                  if len(links) >= 5:

                      break

              if not links:

                  return ""

              return (
                  "## Jalgaon Zone वरील संबंधित माहिती\n\n"
                  + "\n".join(links)
                  + "\n\n"
              )


          # =====================================================
          # CONCLUSION
          # =====================================================

          def conclusion(title):

              return (
                  "## निष्कर्ष\n\n"
                  + title
                  + " हा जळगाव जिल्ह्यासाठी महत्त्वाचा विषय आहे. "
                  "स्थानिक परिस्थिती, उपलब्ध संसाधने आणि अधिकृत "
                  "माहितीचा विचार करून योग्य निर्णय घेणे आवश्यक आहे. "
                  "Jalgaon Zone चा उद्देश जळगाव जिल्ह्याशी संबंधित "
                  "उपयुक्त माहिती सोप्या भाषेत वाचकांपर्यंत पोहोचवणे हा आहे.\n\n"
              )


          # =====================================================
          # GUARANTEE ARTICLE LENGTH
          # =====================================================

          def guarantee_length(
              body,
              title,
              angle
          ):

              blocks = [

                  (
                      f"{title} संदर्भात स्थानिक पातळीवर "
                      f"माहिती समजून घेताना उपलब्ध संसाधने, "
                      f"स्थानिक परिस्थिती आणि भविष्यातील गरजा "
                      f"यांचा एकत्रित विचार करणे आवश्यक आहे."
                  ),

                  (
                      f"या विषयाचा आणखी एक महत्त्वाचा भाग म्हणजे "
                      f"योग्य नियोजन. {angle}. त्यामुळे कोणताही "
                      f"निर्णय घेण्यापूर्वी उपलब्ध पर्यायांची तुलना "
                      f"करणे फायदेशीर ठरू शकते."
                  ),

                  (
                      "स्थानिक नागरिकांसाठी माहिती विश्वासार्ह "
                      "आणि समजण्यास सोपी असणे महत्त्वाचे आहे. "
                      "महत्त्वाच्या सरकारी किंवा आर्थिक बाबतीत "
                      "अधिकृत स्रोतांची माहिती तपासणे आवश्यक आहे."
                  ),

                  (
                      "जळगाव जिल्ह्याचा विकास होत असताना शिक्षण, "
                      "शेती, रोजगार, पर्यटन, व्यवसाय आणि डिजिटल "
                      "सेवा यांसारख्या क्षेत्रांमध्ये नवीन संधी "
                      "निर्माण होत आहेत."
                  )
              ]

              while len(
                  body.split()
              ) < 1100:

                  for block in blocks:

                      body += (
                          "\n\n"
                          + block
                          + "\n"
                      )

                      if len(
                          body.split()
                      ) >= 1100:

                          break

              return body


          # =====================================================
          # SELECT TOPICS
          # =====================================================

          selected_topics = []

          category_names = list(
              topics.keys()
          )

          for category_index, category in enumerate(
              category_names
          ):

              category_topics = topics[
                  category
              ]

              if not category_topics:

                  continue

              start_index = (
                  day_number
                  + category_index
              ) % len(
                  category_topics
              )

              selected = None

              for offset in range(
                  len(category_topics)
              ):

                  index = (
                      start_index
                      + offset
                  ) % len(
                      category_topics
                  )

                  candidate = category_topics[
                      index
                  ]

                  candidate_title = candidate[0]

                  if not already_used(
                      candidate_title
                  ):

                      selected = candidate

                      break

              if selected:

                  selected_topics.append(
                      (
                          category,
                          selected[0],
                          selected[1]
                      )
                  )


          print(
              "Selected articles:",
              len(selected_topics)
          )


          # =====================================================
          # GENERATE ARTICLES
          # =====================================================

          new_articles = []


          for article_number, (
              category,
              title,
              angle
          ) in enumerate(
              selected_topics,
              start=1
          ):

              slug = make_slug(
                  title
              )

              filename_base = (
                  slug
                  + "-"
                  + date_file
              )

              article_file = (
                  "articles/"
                  + filename_base
                  + ".md"
              )

              image_file = (
                  "Images/"
                  + filename_base
                  + ".svg"
              )

              article_id = filename_base


              if os.path.exists(
                  article_file
              ):

                  print(
                      "Article already exists:",
                      article_file
                  )

                  continue


              intro = intros[
                  (
                      article_number
                      - 1
                  ) % len(intros)
              ]


              body = ""

              body += (
                  "# "
                  + title
                  + "\n\n"
              )

              body += (
                  "**दिनांक:** "
                  + date_text
                  + "\n\n"
              )

              body += (
                  "**वर्ग:** "
                  + category
                  + "\n\n"
              )

              body += intro + "\n\n"


              sections = category_sections.get(
                  category,
                  []
              )


              for section_index, section_name in enumerate(
                  sections
              ):

                  body += make_section(
                      section_name,
                      category,
                      angle,
                      section_index
                  )


              body += create_faq(
                  title,
                  category
              )


              body += internal_links()


              body += conclusion(
                  title
              )


              body = guarantee_length(
                  body,
                  title,
                  angle
              )


              # =================================================
              # FRONT MATTER
              # =================================================

              final_content = (
                  "---\n"
                  "title: \""
                  + title.replace(
                      '"',
                      '\\"'
                  )
                  + "\"\n"
                  "category: \""
                  + category.replace(
                      '"',
                      '\\"'
                  )
                  + "\"\n"
                  "date: \""
                  + date_text
                  + "\"\n"
                  "image: \""
                  + image_file
                  + "\"\n"
                  "---\n\n"
                  + body
              )


              # =================================================
              # WRITE MARKDOWN
              # =================================================

              with open(
                  article_file,
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(
                      final_content
                  )


              # =================================================
              # CREATE SVG
              # =================================================

              safe_title = (
                  title
                  .replace("&", "&amp;")
                  .replace("<", "&lt;")
                  .replace(">", "&gt;")
                  .replace('"', "&quot;")
              )

              safe_category = (
                  category
                  .replace("&", "&amp;")
                  .replace("<", "&lt;")
                  .replace(">", "&gt;")
              )

              selected_color = colors[
                  (
                      article_number
                      - 1
                  ) % len(colors)
              ]


              svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
              width="1200"
              height="630"
              viewBox="0 0 1200 630">

              <rect
                width="1200"
                height="630"
                fill="{selected_color}"
              />

              <rect
                x="50"
                y="50"
                width="1100"
                height="530"
                rx="30"
                fill="#ffffff"
                opacity="0.10"
              />

              <text
                x="600"
                y="130"
                text-anchor="middle"
                font-family="Arial, sans-serif"
                font-size="32"
                font-weight="bold"
                fill="#ffffff"
              >
                JALGAON ZONE
              </text>

              <text
                x="600"
                y="220"
                text-anchor="middle"
                font-family="Arial, sans-serif"
                font-size="26"
                fill="#ffffff"
              >
                {safe_category}
              </text>

              <text
                x="600"
                y="330"
                text-anchor="middle"
                font-family="Arial, sans-serif"
                font-size="38"
                font-weight="bold"
                fill="#ffffff"
              >
                {safe_title[:55]}
              </text>

              <text
                x="600"
                y="390"
                text-anchor="middle"
                font-family="Arial, sans-serif"
                font-size="26"
                fill="#ffffff"
              >
                {date_text}
              </text>

              <text
                x="600"
                y="510"
                text-anchor="middle"
                font-family="Arial, sans-serif"
                font-size="24"
                fill="#ffffff"
              >
                Jalgaon Maharashtra
              </text>

              </svg>
              '''


              with open(
                  image_file,
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(svg)


              metadata = {

                  "id": article_id,

                  "title": title,

                  "category": category,

                  "date": date_text,

                  "image": image_file,

                  "description":
                      title
                      + " — Jalgaon Zone वरील "
                      + "सविस्तर माहिती.",

                  "file": article_file,

                  "link":
                      "article.html?id="
                      + article_id
              }


              new_articles.append(
                  metadata
              )


              print(
                  "Generated:",
                  article_file
              )

              print(
                  "Words:",
                  len(
                      body.split()
                  )
              )


          # =====================================================
          # UPDATE ARTICLES-DATA.JS
          # =====================================================

          if new_articles:

              data_file = "articles-data.js"


              if os.path.exists(
                  data_file
              ):

                  with open(
                      data_file,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      old_content = f.read()

              else:

                  old_content = (
                      "const articles = [];"
                  )


              start = old_content.find(
                  "["
              )

              end = old_content.rfind(
                  "]"
              )


              if (
                  start == -1
                  or end == -1
                  or end <= start
              ):

                  raise Exception(
                      "articles-data.js must contain an array"
                  )


              array_text = old_content[
                  start:end + 1
              ]


              try:

                  existing_data = json.loads(
                      array_text
                  )

                  if not isinstance(
                      existing_data,
                      list
                  ):

                      raise Exception(
                          "Articles data is not a list"
                      )

              except Exception as error:

                  raise Exception(
                      "Invalid articles-data.js array: "
                      + str(error)
                  )


              existing_ids = set()

              for item in existing_data:

                  if isinstance(
                      item,
                      dict
                  ):

                      item_id = str(
                          item.get(
                              "id",
                              ""
                          )
                      ).strip()

                      if item_id:

                          existing_ids.add(
                              item_id
                          )


              new_entries = []


              for item in new_articles:

                  if item["id"] in existing_ids:

                      print(
                          "Skipping duplicate metadata:",
                          item["id"]
                      )

                      continue

                  json_item = json.dumps(
                      item,
                      ensure_ascii=False,
                      indent=2
                  )

                  new_entries.append(
                      "  "
                      + json_item
                  )

                  existing_ids.add(
                      item["id"]
                  )


              if new_entries:

                  existing_array_content = (
                      array_text[1:-1].strip()
                  )


                  additions = ",\n".join(
                      new_entries
                  )


                  if existing_array_content:

                      combined = (
                          existing_array_content
                          + ",\n"
                          + additions
                      )

                  else:

                      combined = additions


                  new_array = (
                      "[\n"
                      + combined
                      + "\n]"
                  )


                  new_content = (
                      old_content[:start]
                      + new_array
                      + old_content[end + 1:]
                  )


                  with open(
                      data_file,
                      "w",
                      encoding="utf-8"
                  ) as f:

                      f.write(
                          new_content
                      )


                  print(
                      "articles-data.js updated."
                  )

              else:

                  print(
                      "No new metadata entries."
                  )


          else:

              print(
                  "No new articles generated."
              )


          # =====================================================
          # SUMMARY
          # =====================================================

          print("")
          print("====================================")
          print("ARTICLE GENERATION COMPLETE")
          print("====================================")
          print(
              "Date:",
              date_text
          )
          print(
              "Generated:",
              len(new_articles)
          )
          print(
              "Existing article files:",
              len(existing_article_files)
          )
          print("====================================")


          PY


