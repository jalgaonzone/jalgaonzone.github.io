          # =====================================================
          # NORMALIZE
          # =====================================================

          def normalize(text):

              text = text.lower()

              text = re.sub(
                  r"[^a-z0-9\u0900-\u097f]+",
                  " ",
                  text
              )

              return " ".join(
                  text.split()
              )


          normalized_existing = normalize(
              all_existing_text
          )


          def already_used(title):

              normalized_title = normalize(
                  title
              )

              if not normalized_title:

                  return False

              return normalized_title in normalized_existing


          # =====================================================
          # SLUG
          # =====================================================

          def make_slug(text):

              replacements = {

                  "जळगाव": "jalgaon",
                  "जिल्हा": "district",
                  "माहिती": "information",
                  "इतिहास": "history",
                  "शेती": "agriculture",
                  "शेतकरी": "farmers",
                  "केळी": "banana",
                  "पर्यटन": "tourism",
                  "शिक्षण": "education",
                  "रोजगार": "jobs",
                  "सरकारी": "government",
                  "योजना": "scheme",
                  "हवामान": "weather",
                  "पाणी": "water",
                  "व्यवसाय": "business",
                  "विद्यार्थी": "students",
                  "कृषी": "agriculture"
              }

              slug = text.lower()

              for marathi, english in replacements.items():

                  slug = slug.replace(
                      marathi,
                      english
                  )

              slug = re.sub(
                  r"[^a-zA-Z0-9]+",
                  "-",
                  slug
              )

              slug = re.sub(
                  r"-+",
                  "-",
                  slug
              )

              slug = slug.strip("-")

              short_hash = hashlib.md5(
                  text.encode("utf-8")
              ).hexdigest()[:8]

              if not slug:

                  slug = "jalgaon-article"

              return (
                  slug[:100]
                  + "-"
                  + short_hash
              )


