          tz = ZoneInfo("Asia/Kolkata")

          now = datetime.now(tz)

          today = now.date()

          date_text = today.strftime("%d %B %Y")

          date_file = today.strftime("%Y-%m-%d")

          day_number = today.timetuple().tm_yday


          os.makedirs("articles", exist_ok=True)
          os.makedirs("Images", exist_ok=True)


          # =====================================================
          # LOAD TOPIC ENGINE
          # =====================================================

          topic_engine_file = "content/topic-engine.yml"

          if os.path.exists(topic_engine_file):

              try:

                  import yaml

                  with open(
                      topic_engine_file,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      topic_engine = yaml.safe_load(f) or {}

                  print("Topic engine loaded successfully.")

                  print(
                      "Regions:",
                      topic_engine.get("regions", [])
                  )

                  print(
                      "Languages:",
                      topic_engine.get("languages", [])
                  )

                  print(
                      "Location mix:",
                      topic_engine.get("location_mix", [])
                  )

              except Exception as error:

                  print(
                      "Topic engine load warning:",
                      error
                  )

          else:

              print(
                  "content/topic-engine.yml not found. "
                  "Using built-in topic engine."
              )


