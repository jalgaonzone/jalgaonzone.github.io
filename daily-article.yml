      # ==========================================
      # 4. Update articles-data.js
      # ==========================================

      - name: Update article index
        run: |

          python - <<'PY'

          import json
          import re


          metadata_file = \
              "/tmp/new_articles.json"


          with open(
              metadata_file,
              encoding="utf-8"
          ) as f:

              new_articles = json.load(f)


          if not new_articles:

              print(
                  "No new articles."
              )

              raise SystemExit(0)


          file = "articles-data.js"


          with open(
              file,
              encoding="utf-8"
          ) as f:

              content = f.read()


          match = re.search(
              r"const articles\s*=\s*\[(.*?)\];",
              content,
              re.DOTALL
          )


          if not match:

              raise Exception(
                  "articles-data.js format not recognized"
              )


          old_items = match.group(1).strip()


          new_items = []


          for article in new_articles:

              new_items.append(
                  json.dumps(
                      article,
                      ensure_ascii=False,
                      indent=4
                  )
              )


          additions = ",\n\n    ".join(
              new_items
          )


          if old_items:

              combined = (
                  old_items
                  + ",\n\n    "
                  + additions
              )

          else:

              combined = additions


          new_content = (

              content[:match.start(1)]

              + "\n\n    "

              + combined

              + "\n\n"

              + content[match.end(1):]

          )


          with open(
              file,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  new_content
              )


          print(
              "articles-data.js updated."
          )

          PY


